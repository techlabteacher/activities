<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest for Planet Qwerty - Mission Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --class-theme-color: #38bdf8; /* Default Theme Color */
      --primary: #4f46e5;
      --secondary: #0ea5e9;
      --accent-yellow: #f59e0b;
      --accent-green: #22c55e;
      --font-playful: 'Fredoka One', cursive;
      --font-body: 'Open Sans', system-ui, -apple-system, sans-serif;
      --font-tech: 'Share Tech Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090d16 100%);
      color: #ffffff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* Screen Visual Outline matching selected class color */
    .hub-viewport-border {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 12px solid var(--class-theme-color);
      pointer-events: none;
      z-index: 100;
      box-shadow: inset 0 0 25px var(--class-theme-color);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    header {
      position: relative;
      z-index: 10;
      margin-top: 20px;
      text-align: center;
    }
    h1 {
      font-family: var(--font-playful);
      font-size: 2.8rem;
      color: var(--class-theme-color);
      text-shadow: 0 0 15px var(--class-theme-color);
      letter-spacing: 1px;
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }
    p.subtitle {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-top: 5px;
      font-weight: 600;
    }

    .student-badge-display {
      margin-top: 8px;
      font-family: var(--font-tech);
      font-size: 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--class-theme-color);
      color: var(--class-theme-color);
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
    }

    .mission-map {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1100px;
      padding: 20px;
    }

    .mission-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s ease;
      position: relative;
    }
    .mission-node:hover {
      transform: translateY(-10px) scale(1.05);
    }

    .icon-container {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: 50%;
    }

    .rocket-icon {
      font-size: 5rem;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
      animation: float 3s ease-in-out infinite;
    }

    .moon-icon {
      width: 120px;
      height: 120px;
      background: #e2e8f0;
      border-radius: 50%;
      box-shadow: inset -15px -10px 0 0 #94a3b8, 0 0 20px rgba(226, 232, 240, 0.5);
      position: relative;
      overflow: hidden;
    }
    .moon-crater-1 { position: absolute; top: 25px; left: 30px; width: 25px; height: 25px; background: #cbd5e1; border-radius: 50%; box-shadow: inset 2px 2px 0 #94a3b8; }
    .moon-crater-2 { position: absolute; top: 65px; left: 70px; width: 35px; height: 35px; background: #cbd5e1; border-radius: 50%; box-shadow: inset 2px 2px 0 #94a3b8; }
    .moon-crater-3 { position: absolute; top: 75px; left: 25px; width: 18px; height: 18px; background: #cbd5e1; border-radius: 50%; box-shadow: inset 2px 2px 0 #94a3b8; }

    .sun-icon {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #fde047 0%, #f59e0b 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px #f59e0b, 0 0 60px rgba(245, 158, 11, 0.4);
      animation: pulse 2.5s ease-in-out infinite alternate;
    }

    .mission-label {
      margin-top: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid var(--class-theme-color);
      border-radius: 12px;
      padding: 10px 18px;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      min-width: 200px;
    }
    
    .mission-title {
      font-family: var(--font-playful);
      font-size: 1.15rem;
      color: var(--class-theme-color);
    }
    .mission-subtitle {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    .star-score-badge {
      display: none;
      margin-top: 6px;
      font-family: var(--font-tech);
      font-size: 0.9rem;
      color: #000000;
      background: var(--accent-yellow);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    .mission-node.completed .mission-label {
      background: var(--accent-green) !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6) !important;
    }

    .mission-node.completed .mission-title,
    .mission-node.completed .mission-subtitle {
      color: #020617 !important;
      font-weight: 900;
    }

    .mission-node.completed .star-score-badge {
      display: inline-block;
      background: #020617;
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
    }

    /* Modal Login Screen Styles */
    .login-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.96);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: #0f172a;
      border: 3px solid var(--secondary);
      border-radius: 24px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px rgba(14, 165, 233, 0.3);
    }

    .login-title {
      font-family: var(--font-playful);
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .login-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .btn-class-select {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 12px;
      color: white;
      font-family: var(--font-playful);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .btn-class-select:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .helmet-svg {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    /* Computer Number Grid */
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 15px;
      max-height: 280px;
      overflow-y: auto;
      padding: 5px;
    }

    .btn-comp {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-family: var(--font-tech);
      font-size: 1.1rem;
      padding: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-comp:hover {
      background: var(--class-theme-color);
      color: #020617;
    }

    .btn-reset-login {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-family: var(--font-tech);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }

    footer {
      position: relative;
      z-index: 10;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 15px;
    }
  </style>
</head>
<body>

  <!-- Colored Screen Outer Border -->
  <div class="hub-viewport-border" id="screenOutline"></div>

  <canvas id="spaceCanvas"></canvas>

  <header>
    <h1>Quest for Planet Qwerty</h1>
    <p class="subtitle">Select your mission to begin typing training!</p>
    <div id="studentBadge" class="student-badge-display" style="display: none;"></div>
  </header>

  <main class="mission-map">
    <!-- Mission 1 -->
    <a href="mission1/index.html" class="mission-node" id="mission1Node">
      <div class="icon-container">
        <div class="rocket-icon">🚀</div>
      </div>
      <div class="mission-label">
        <div class="mission-title" id="m1Title">Mission 1</div>
        <div class="mission-subtitle">FJDK Lift-off</div>
        <div class="star-score-badge" id="m1Stars">⭐ 0 / 18 Stars</div>
      </div>
    </a>

    <!-- Mission 2 -->
    <a href="mission2/index.html" class="mission-node" id="mission2Node">
      <div class="icon-container">
        <div class="moon-icon">
          <div class="moon-crater-1"></div>
          <div class="moon-crater-2"></div>
          <div class="moon-crater-3"></div>
        </div>
      </div>
      <div class="mission-label">
        <div class="mission-title">Mission 2</div>
        <div class="mission-subtitle">SLA; Moon Landing</div>
        <div class="star-score-badge" id="m2Stars">⭐ 0 / 18 Stars</div>
      </div>
    </a>

    <!-- Mission 3 -->
    <a href="mission3/index.html" class="mission-node" id="mission3Node">
      <div class="icon-container">
        <div class="sun-icon"></div>
      </div>
      <div class="mission-label">
        <div class="mission-title">Mission 3</div>
        <div class="mission-subtitle">Helio Home Row</div>
        <div class="star-score-badge" id="m3Stars">⭐ 0 / 18 Stars</div>
      </div>
    </a>
  </main>

  <footer>
    <span>Click any celestial object to launch into lessons.</span>
    <button class="btn-reset-login" onclick="clearLogin()">Change Class / Computer</button>
  </footer>

  <!-- Login Overlay -->
  <div class="login-modal-overlay" id="loginModal">
    <div class="login-card">
      
      <!-- Step 1: Select Teacher / Group -->
      <div id="stepTeacher">
        <h2 class="login-title">Select Your Class</h2>
        <div class="login-grid">
          <!-- Bottita (Pink) -->
          <button class="btn-class-select" onclick="selectClass('Bottita', '#ec4899')">
            <svg class="helmet-svg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="#ec4899"/>
              <path d="M 25 45 Q 50 25 75 45 Q 75 70 50 70 Q 25 70 25 45 Z" fill="#020617"/>
              <path d="M 30 43 Q 50 28 65 43" stroke="#38bdf8" stroke-width="4" fill="none"/>
            </svg>
            Bottita
          </button>

          <!-- Blue Group (Green) -->
          <button class="btn-class-select" onclick="selectClass('Blue Group', '#22c55e')">
            <svg class="helmet-svg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="#22c55e"/>
              <path d="M 25 45 Q 50 25 75 45 Q 75 70 50 70 Q 25 70 25 45 Z" fill="#020617"/>
              <path d="M 30 43 Q 50 28 65 43" stroke="#38bdf8" stroke-width="4" fill="none"/>
            </svg>
            Blue Group
          </button>

          <!-- Raddatz (Yellow) -->
          <button class="btn-class-select" onclick="selectClass('Raddatz', '#eab308')">
            <svg class="helmet-svg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="#eab308"/>
              <path d="M 25 45 Q 50 25 75 45 Q 75 70 50 70 Q 25 70 25 45 Z" fill="#020617"/>
              <path d="M 30 43 Q 50 28 65 43" stroke="#38bdf8" stroke-width="4" fill="none"/>
            </svg>
            Raddatz
          </button>

          <!-- Red Group (Orange) -->
          <button class="btn-class-select" onclick="selectClass('Red Group', '#f97316')">
            <svg class="helmet-svg" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="#f97316"/>
              <path d="M 25 45 Q 50 25 75 45 Q 75 70 50 70 Q 25 70 25 45 Z" fill="#020617"/>
              <path d="M 30 43 Q 50 28 65 43" stroke="#38bdf8" stroke-width="4" fill="none"/>
            </svg>
            Red Group
          </button>
        </div>
      </div>

      <!-- Step 2: Select Computer #1-32 -->
      <div id="stepComputer" style="display: none;">
        <h2 class="login-title" id="compStepTitle">Select Your Computer</h2>
        <div class="comp-grid" id="compGrid"></div>
      </div>

    </div>
  </div>

  <script>
    let selectedClassName = "";
    let selectedClassColor = "";

    function initLogin() {
      const savedClass = localStorage.getItem('qwerty_class_name');
      const savedColor = localStorage.getItem('qwerty_class_color');
      const savedComp = localStorage.getItem('qwerty_computer_num');

      if (savedClass && savedColor && savedComp) {
        applyTheme(savedColor);
        showStudentBadge(savedClass, savedComp);
        document.getElementById('loginModal').style.display = 'none';
      } else {
        document.getElementById('loginModal').style.display = 'flex';
        showTeacherStep();
      }
    }

    function showTeacherStep() {
      document.getElementById('stepTeacher').style.display = 'block';
      document.getElementById('stepComputer').style.display = 'none';
    }

    function selectClass(className, classColor) {
      selectedClassName = className;
      selectedClassColor = classColor;
      applyTheme(classColor);

      document.getElementById('stepTeacher').style.display = 'none';
      document.getElementById('stepComputer').style.display = 'block';
      document.getElementById('compStepTitle').innerText = `${className}: Select Computer`;

      const grid = document.getElementById('compGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 32; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-comp';
        btn.innerText = `#${i}`;
        btn.onclick = () => selectComputer(i);
        grid.appendChild(btn);
      }
    }

    function selectComputer(compNum) {
      localStorage.setItem('qwerty_class_name', selectedClassName);
      localStorage.setItem('qwerty_class_color', selectedClassColor);
      localStorage.setItem('qwerty_computer_num', compNum);

      showStudentBadge(selectedClassName, compNum);
      document.getElementById('loginModal').style.display = 'none';
    }

    function applyTheme(color) {
      document.documentElement.style.setProperty('--class-theme-color', color);
    }

    function showStudentBadge(className, compNum) {
      const badge = document.getElementById('studentBadge');
      badge.style.display = 'inline-block';
      badge.innerText = `CLASS: ${className.toUpperCase()} | COMPUTER #${compNum}`;
    }

    function clearLogin() {
      localStorage.removeItem('qwerty_class_name');
      localStorage.removeItem('qwerty_class_color');
      localStorage.removeItem('qwerty_computer_num');
      location.reload();
    }

    // Dynamic Starfield Canvas
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      }));
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha >= 1 || star.alpha <= 0.1) star.speed = -star.speed;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, star.alpha)})`;
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }

    function loadHubProgress() {
      const m1Stars = localStorage.getItem('mission1_stars');
      if (m1Stars !== null && parseInt(m1Stars) > 0) {
        const m1Node = document.getElementById('mission1Node');
        const m1Badge = document.getElementById('m1Stars');
        const m1Title = document.getElementById('m1Title');
        
        m1Node.classList.add('completed');
        m1Title.innerText = "✔ Mission 1";
        m1Badge.innerText = `⭐ ${m1Stars} / 18 Stars`;
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();
    initLogin();
    loadHubProgress();
  </script>
</body>
</html>
