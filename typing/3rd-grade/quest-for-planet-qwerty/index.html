<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest for Planet Qwerty - Mission Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Open+Sans:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #0ea5e9;
      --accent-yellow: #f59e0b;
      --accent-green: #22c55e;
      --font-playful: 'Fredoka One', cursive;
      --font-body: 'Open Sans', system-ui, -apple-system, sans-serif;
      --font-tech: 'Share Tech Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090d16 100%);
      color: #ffffff;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    header {
      position: relative;
      z-index: 10;
      margin-top: 30px;
      text-align: center;
    }
    h1 {
      font-family: var(--font-playful);
      font-size: 2.8rem;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      letter-spacing: 1px;
    }
    p.subtitle {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-top: 5px;
      font-weight: 600;
    }

    .mission-map {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1100px;
      padding: 20px;
    }

    .mission-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s ease;
      position: relative;
    }
    .mission-node:hover {
      transform: translateY(-10px) scale(1.05);
    }

    .icon-container {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: 50%;
      transition: box-shadow 0.3s ease;
    }

    /* Target 1: Rocket */
    .rocket-icon {
      font-size: 5rem;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
      animation: float 3s ease-in-out infinite;
    }

    /* Target 2: Moon */
    .moon-icon {
      width: 120px;
      height: 120px;
      background: #e2e8f0;
      border-radius: 50%;
      box-shadow: inset -15px -10px 0 0 #94a3b8, 0 0 20px rgba(226, 232, 240, 0.5);
      position: relative;
      overflow: hidden;
    }
    .moon-crater-1 { position: absolute; top: 25px; left: 30px; width: 25px; height: 25px; background: #cbd5e1; border-radius: 50%; box-shadow: inset 2px 2px 0 #94a3b8; }
    .moon-crater-2 { position: absolute; top: 65px; left: 70px; width: 35px; height: 35px; background: #cbd5e1; border-radius: 50%; box-shadow: inset 2px 2px 0 #94a3b8; }
    .moon-crater-3 { position: absolute; top: 75px; left: 25px; width: 18px; height: 18px; background: #cbd5e1; border-radius: 50%; box-shadow: inset 2px 2px 0 #94a3b8; }

    /* Target 3: Sun */
    .sun-icon {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #fde047 0%, #f59e0b 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px #f59e0b, 0 0 60px rgba(245, 158, 11, 0.4);
      animation: pulse 2.5s ease-in-out infinite alternate;
    }

    /* Mission Label Cards */
    .mission-label {
      margin-top: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 10px 18px;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      min-width: 200px;
    }
    
    .mission-title {
      font-family: var(--font-playful);
      font-size: 1.15rem;
      color: #38bdf8;
    }
    .mission-subtitle {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    .star-score-badge {
      display: none;
      margin-top: 6px;
      font-family: var(--font-tech);
      font-size: 0.9rem;
      color: #000000;
      background: var(--accent-yellow);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* Completed State Styling (Green Card) */
    .mission-node.completed .mission-label {
      background: var(--accent-green) !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6) !important;
    }

    .mission-node.completed .mission-title,
    .mission-node.completed .mission-subtitle {
      color: #020617 !important;
      font-weight: 900;
    }

    .mission-node.completed .star-score-badge {
      display: inline-block;
      background: #020617;
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 35px #f59e0b; }
      100% { transform: scale(1.06); box-shadow: 0 0 50px #f59e0b, 0 0 80px rgba(245, 158, 11, 0.6); }
    }

    footer {
      position: relative;
      z-index: 10;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <canvas id="spaceCanvas"></canvas>

  <header>
    <h1>Quest for Planet Qwerty</h1>
    <p class="subtitle">Select your mission to begin typing training!</p>
  </header>

  <main class="mission-map">
    <!-- Mission 1: Rocket -->
    <a href="mission1/index.html" class="mission-node" id="mission1Node">
      <div class="icon-container">
        <div class="rocket-icon">🚀</div>
      </div>
      <div class="mission-label">
        <div class="mission-title" id="m1Title">Mission 1</div>
        <div class="mission-subtitle">FJDK Lift-off</div>
        <div class="star-score-badge" id="m1Stars">⭐ 0 / 18 Stars</div>
      </div>
    </a>

    <!-- Mission 2: Moon -->
    <a href="mission2/index.html" class="mission-node" id="mission2Node">
      <div class="icon-container">
        <div class="moon-icon">
          <div class="moon-crater-1"></div>
          <div class="moon-crater-2"></div>
          <div class="moon-crater-3"></div>
        </div>
      </div>
      <div class="mission-label">
        <div class="mission-title">Mission 2</div>
        <div class="mission-subtitle">SLA; Moon Landing</div>
        <div class="star-score-badge" id="m2Stars">⭐ 0 / 18 Stars</div>
      </div>
    </a>

    <!-- Mission 3: Sun -->
    <a href="mission3/index.html" class="mission-node" id="mission3Node">
      <div class="icon-container">
        <div class="sun-icon"></div>
      </div>
      <div class="mission-label">
        <div class="mission-title">Mission 3</div>
        <div class="mission-subtitle">Helio Home Row</div>
        <div class="star-score-badge" id="m3Stars">⭐ 0 / 18 Stars</div>
      </div>
    </a>
  </main>

  <footer>
    Click any celestial object to launch into the lesson setup.
  </footer>

  <script>
    // Dynamic Starfield Canvas
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      }));
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha >= 1 || star.alpha <= 0.1) star.speed = -star.speed;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, star.alpha)})`;
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }

    // Read stored progress from localStorage
    function loadHubProgress() {
      const m1Stars = localStorage.getItem('mission1_stars');
      if (m1Stars !== null && parseInt(m1Stars) > 0) {
        const m1Node = document.getElementById('mission1Node');
        const m1Badge = document.getElementById('m1Stars');
        const m1Title = document.getElementById('m1Title');
        
        m1Node.classList.add('completed');
        m1Title.innerText = "✔ Mission 1";
        m1Badge.innerText = `⭐ ${m1Stars} / 18 Stars`;
      }
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();
    loadHubProgress();
  </script>
</body>
</html>
