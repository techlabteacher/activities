
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission 1: Home Row Mastery</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --font-tech: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container { width: 100%; max-width: 900px; }
    
    /* Navigation Bar */
    .nav-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .nav-btn {
      background: #334155;
      color: #94a3b8;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .nav-btn.active { background: var(--accent-blue); color: #fff; }
    .nav-btn.level-up-btn { background: #8b5cf6; color: #fff; }
    .nav-btn.level-up-btn.active { background: #7c3aed; box-shadow: 0 0 10px #8b5cf6; }

    /* Stats Bar */
    .telemetry-bar {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    /* Terminal & Displays */
    .terminal {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 30px;
      position: relative;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .text-display {
      font-family: var(--font-tech);
      font-size: 2rem;
      letter-spacing: 2px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      z-index: 2;
    }

    /* Character Highlighting & Space Width Fix */
    .char-node {
      display: inline-block;
      min-width: 2.2rem;
      text-align: center;
      white-space: pre;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background-color 0.15s, color 0.15s;
    }

    .char-current {
      background-color: var(--accent-blue) !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
    }

    .char-error {
      background-color: var(--accent-red) !important;
      color: #ffffff !important;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
    }

    .char-done { color: #64748b; }

    /* Lesson 4 Rocket */
    .rocket-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 1;
    }
    #activeRocket {
      position: absolute;
      font-size: 2.5rem;
      transition: left 0.2s ease;
      filter: drop-shadow(0 0 8px var(--accent-blue));
    }

    /* Keyboard Display */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
    }
    .key-row { display: flex; justify-content: center; gap: 6px; }
    .key {
      background: #334155;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }
    .key.active { background: var(--accent-blue); }
    .key-shift { min-width: 80px; background: #475569; }
    .key-shift.active { background: var(--accent-gold); }

    /* Level Up Specific Screen UI */
    .level-up-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .level-header {
      color: var(--accent-gold);
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .lesson-checklist {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 10px 0;
    }
    .checklist-item {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid #334155;
    }
    .checklist-item.done { border-color: var(--accent-green); color: #4ade80; }

    /* Teacher Review & Export Controls */
    .teacher-panel {
      margin-top: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
    }
    .teacher-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-export {
      background: var(--accent-green);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: var(--card-bg);
      border: 2px solid #475569;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
    }
    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
    }

    /* Spinning Lesson Star Visuals */
    .star-rating { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .star-icon {
      width: 40px; height: 40px; fill: var(--accent-gold);
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.8));
      animation: starDance 1.2s infinite ease-in-out alternate;
    }
    .star-icon:nth-child(2) { animation-delay: 0.2s; }
    .star-icon:nth-child(3) { animation-delay: 0.4s; }

    @keyframes starDance {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      100% { transform: translateY(-10px) rotate(15deg) scale(1.15); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Navigation Header Buttons -->
  <div class="nav-bar" id="navBar"></div>

  <div class="telemetry-bar">
    <div>MODE: <span id="lessonTitle">Lesson 1</span></div>
    <div>ACCURACY: <span id="accuracyVal">100%</span></div>
  </div>

  <div class="terminal">
    <div class="rocket-container">
      <div id="activeRocket" style="display: none;">🚀</div>
    </div>
    
    <!-- Level Up Banner & Checklist -->
    <div id="levelUpHeader" class="level-up-container" style="display: none;">
      <div class="level-header">LEVEL UP TO BRONZE</div>
      <div class="checklist-item" style="border-color: var(--accent-gold);">
        ⭐ Total Stars Earned: <span id="totalStarsCount">0</span>
      </div>
      <div class="lesson-checklist" id="checklistContainer"></div>
      <p style="font-size: 0.9rem; color: #94a3b8;">Requirement: Maximum 2 mistakes allowed!</p>
    </div>

    <div id="textNodesContainer" class="text-display" style="margin-top: 15px;"></div>
  </div>

  <!-- On-Screen Keyboard -->
  <div class="keyboard" id="keyboardContainer">
    <div class="key-row">
      <div class="key" id="key-a">A</div>
      <div class="key" id="key-s">S</div>
      <div class="key" id="key-d">D</div>
      <div class="key" id="key-f">F</div>
      <div class="key" id="key-g">G</div>
      <div class="key" id="key-h">H</div>
      <div class="key" id="key-j">J</div>
      <div class="key" id="key-k">K</div>
      <div class="key" id="key-l">L</div>
      <div class="key" id="key-semicolon">;</div>
    </div>
    <div class="key-row">
      <div class="key key-shift" id="key-ShiftLeft">SHIFT (L)</div>
      <div class="key" style="min-width: 200px;" id="key-Space">SPACE</div>
      <div class="key key-shift" id="key-ShiftRight">SHIFT (R)</div>
    </div>
  </div>

  <!-- Teacher Export Panel -->
  <div class="teacher-panel">
    <h4 style="color: var(--accent-gold);">Teacher Analytics Controls</h4>
    <div class="teacher-controls">
      <button class="btn-export" onclick="exportAccuracySummaryCSV()">📊 Export Accuracy Summary (.csv)</button>
      <button class="btn-export" style="background: var(--accent-red);" onclick="exportMistakesLogCSV()">🎯 Export Key Mistake Log (.csv)</button>
    </div>
  </div>
</div>

<div id="lessonModal" class="modal">
  <div class="modal-card" id="modalContent"></div>
</div>

<script>
  const lessons = [
    { id: 1, title: "Lesson 1", text: "f f j j f j f j" },
    { id: 2, title: "Lesson 2", text: "d d k k d k d k" },
    { id: 3, title: "Lesson 3", text: "a a l l a l a l" },
    { id: 4, title: "Lesson 4", text: "f j d k a l space", isRocket: true },
    { id: 5, title: "Lesson 5", text: "fj dk al fjd kal" },
    { id: 6, title: "Lesson 6", text: "F J D K A L", requiresShift: true }
  ];

  const levelUpBaseText = "jsgl;ahdkf";
  let isLevelUpMode = false;
  let currentLessonIdx = 0;
  let currentIndex = 0;
  let correctTyped = 0;
  let errorCount = 0;
  let errorIndices = [];
  let lessonMistakes = {};
  let completedLessons = new Set();
  let activeChallengeText = "";
  let rocketTimer = null;
  let rocketTop = 80;

  const targetContainer = document.getElementById('textNodesContainer');

  function init() {
    loadMistakeHistory();
    buildNavButtons();
    setupLesson(0);
    window.addEventListener('keydown', handleKeyPress);
    window.addEventListener('keyup', handleKeyUp);
  }

  function buildNavButtons() {
    const nav = document.getElementById('navBar');
    nav.innerHTML = '';
    
    lessons.forEach((l, idx) => {
      const btn = document.createElement('button');
      btn.className = `nav-btn ${idx === currentLessonIdx && !isLevelUpMode ? 'active' : ''}`;
      btn.innerText = l.title;
      btn.onclick = () => { isLevelUpMode = false; setupLesson(idx); };
      nav.appendChild(btn);
    });

    const lvlBtn = document.createElement('button');
    lvlBtn.className = `nav-btn level-up-btn ${isLevelUpMode ? 'active' : ''}`;
    lvlBtn.innerText = '⚡ Level Up';
    lvlBtn.onclick = () => startLevelUpChallenge();
    nav.appendChild(lvlBtn);
  }

  function scrambleText(text) {
    return text.split('').sort(() => Math.random() - 0.5).join('');
  }

  function startLevelUpChallenge() {
    isLevelUpMode = true;
    activeChallengeText = scrambleText(levelUpBaseText);
    buildNavButtons();
    setupLessonUI();
  }

  function setupLesson(idx) {
    isLevelUpMode = false;
    currentLessonIdx = idx;
    activeChallengeText = lessons[currentLessonIdx].text;
    buildNavButtons();
    setupLessonUI();
  }

  function setupLessonUI() {
    currentIndex = 0;
    correctTyped = 0;
    errorCount = 0;
    errorIndices = [];
    clearInterval(rocketTimer);

    const rocket = document.getElementById('activeRocket');
    const keyboard = document.getElementById('keyboardContainer');
    const levelHeader = document.getElementById('levelUpHeader');

    if (isLevelUpMode) {
      document.getElementById('lessonTitle').innerText = "LEVEL UP: BRONZE";
      keyboard.style.display = 'none';
      rocket.style.display = 'none';
      levelHeader.style.display = 'flex';
      renderChecklist();
    } else {
      const lesson = lessons[currentLessonIdx];
      document.getElementById('lessonTitle').innerText = lesson.title;
      keyboard.style.display = 'flex';
      levelHeader.style.display = 'none';

      if (lesson.isRocket) {
        rocket.style.display = 'block';
        startRocketAscent();
      } else {
        rocket.style.display = 'none';
      }
    }

    renderText();
    updateStats();
  }

  function renderChecklist() {
    const container = document.getElementById('checklistContainer');
    container.innerHTML = '';
    
    lessons.forEach(l => {
      const isDone = completedLessons.has(l.id);
      const item = document.createElement('div');
      item.className = `checklist-item ${isDone ? 'done' : ''}`;
      item.innerText = `${isDone ? '✓' : '◯'} ${l.title}`;
      container.appendChild(item);
    });

    document.getElementById('totalStarsCount').innerText = completedLessons.size * 3;
  }

  function renderText() {
    targetContainer.innerHTML = '';
    const text = activeChallengeText;
    const history = lessonMistakes[isLevelUpMode ? 'levelup' : currentLessonIdx] || [];
    const historicalMistakeIndices = history.map(m => m.index);

    for (let i = 0; i < text.length; i++) {
      const span = document.createElement('span');
      span.className = 'char-node';
      span.innerText = text[i];

      if (historicalMistakeIndices.includes(i) || errorIndices.includes(i)) {
        span.classList.add('char-error');
      } else if (i === currentIndex) {
        span.classList.add('char-current');
      } else if (i < currentIndex) {
        span.classList.add('char-done');
      }

      targetContainer.appendChild(span);
    }
  }

  function handleKeyPress(e) {
    const expectedChar = activeChallengeText[currentIndex];

    highlightKey(e.code, true);

    if (!isLevelUpMode && lessons[currentLessonIdx].requiresShift) {
      const isCapital = expectedChar === expectedChar.toUpperCase() && expectedChar !== expectedChar.toLowerCase();
      if (isCapital && !e.shiftKey) {
        recordMistake(currentIndex, expectedChar, e.key);
        renderText();
        return;
      }
    }

    const expectedMatch = expectedChar === ' ' ? ' ' : expectedChar;

    if (e.key === expectedMatch || (expectedChar === 'space' && e.code === 'Space')) {
      correctTyped++;
      currentIndex++;
      if (!isLevelUpMode && lessons[currentLessonIdx].isRocket) {
        resetRocketPosition();
      }
    } else if (e.key !== 'Shift') {
      errorCount++;
      errorIndices.push(currentIndex);
      recordMistake(currentIndex, expectedChar, e.key);
    }

    updateStats();
    renderText();

    if (currentIndex >= activeChallengeText.length) {
      clearInterval(rocketTimer);
      checkCompletion();
    }
  }

  function handleKeyUp(e) {
    highlightKey(e.code, false);
  }

  function highlightKey(code, active) {
    let keyEl = document.getElementById(`key-${code.replace('Key', '').toLowerCase()}`);
    if (code === 'Semicolon') keyEl = document.getElementById('key-semicolon');
    if (code === 'Space') keyEl = document.getElementById('key-Space');
    if (code === 'ShiftLeft') keyEl = document.getElementById('key-ShiftLeft');
    if (code === 'ShiftRight') keyEl = document.getElementById('key-ShiftRight');
    
    if (keyEl) {
      if (active) keyEl.classList.add('active');
      else keyEl.classList.remove('active');
    }
  }

  function startRocketAscent() {
    rocketTop = 70;
    const rocket = document.getElementById('activeRocket');
    rocket.style.top = `${rocketTop}%`;
    rocket.style.filter = "drop-shadow(0 0 8px #3b82f6)";

    rocketTimer = setInterval(() => {
      rocketTop -= 1.2;
      rocket.style.top = `${rocketTop}%`;

      if (rocketTop < 35) {
        rocket.style.filter = "drop-shadow(0 0 12px #ef4444) hue-rotate(140deg)";
      }

      if (rocketTop <= 5) {
        errorCount++;
        errorIndices.push(currentIndex);
        recordMistake(currentIndex, activeChallengeText[currentIndex], 'TIMEOUT');
        currentIndex++;
        resetRocketPosition();
        renderText();

        if (currentIndex >= activeChallengeText.length) {
          clearInterval(rocketTimer);
          checkCompletion();
        }
      }
    }, 150);
  }

  function resetRocketPosition() {
    rocketTop = 70;
    const rocket = document.getElementById('activeRocket');
    if (rocket) {
      rocket.style.top = `${rocketTop}%`;
      rocket.style.filter = "drop-shadow(0 0 8px #3b82f6)";
    }
  }

  function recordMistake(idx, expected, typed) {
    const key = isLevelUpMode ? 'levelup' : currentLessonIdx;
    if (!lessonMistakes[key]) lessonMistakes[key] = [];
    lessonMistakes[key].push({ index: idx, expected: expected, typed: typed, time: new Date().toLocaleTimeString() });
    saveMistakeHistory();
  }

  function saveMistakeHistory() {
    localStorage.setItem('qwerty_mission1_mistakes', JSON.stringify(lessonMistakes));
  }

  function loadMistakeHistory() {
    const data = localStorage.getItem('qwerty_mission1_mistakes');
    if (data) lessonMistakes = JSON.parse(data);
  }

  function updateStats() {
    const total = correctTyped + errorIndices.length;
    const acc = total > 0 ? Math.round((correctTyped / total) * 100) : 100;
    document.getElementById('accuracyVal').innerText = `${acc}%`;
  }

  function checkCompletion() {
    const modal = document.getElementById('lessonModal');
    const content = document.getElementById('modalContent');

    if (isLevelUpMode) {
      if (errorCount <= 2) {
        triggerFireworks();
        content.innerHTML = `
          <h2 style="color: var(--accent-gold); font-size: 1.8rem;">🏆 LEVEL UP PASSED!</h2>
          <p style="margin: 15px 0; font-size: 1.1rem;">Congratulations! You’ve reached the <strong>BRONZE</strong> level.</p>
          <div style="background: #334155; padding: 10px; border-radius: 8px; font-weight: bold; color: #38bdf8;">
            You are now a CADET!
          </div>
          <button class="btn" onclick="closeModal(false)">Awesome!</button>
        `;
      } else {
        content.innerHTML = `
          <h2 style="color: var(--accent-red)">⚠️ Level Up Failed</h2>
          <p style="margin: 15px 0;">You made <strong>${errorCount} mistakes</strong>. Maximum allowed is 2.</p>
          <button class="btn" onclick="startLevelUpChallenge(); closeModal(false);">🔄 Try Again</button>
        `;
      }
    } else {
      const total = correctTyped + errorIndices.length;
      const accuracy = total > 0 ? Math.round((correctTyped / total) * 100) : 0;

      if (accuracy < 80) {
        content.innerHTML = `
          <h2 style="color: var(--accent-red)">⚠️ Try Again</h2>
          <p style="margin: 15px 0;">You achieved <strong>${accuracy}%</strong> accuracy. You need at least 80% to complete this lesson.</p>
          <button class="btn" onclick="closeModal(false)">🔄 Retry Lesson</button>
        `;
      } else {
        completedLessons.add(lessons[currentLessonIdx].id);
        content.innerHTML = `
          <h2 style="color: var(--accent-green)">🎉 Lesson Complete!</h2>
          <div class="star-rating">
            <svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </div>
          <p>Accuracy: <strong>${accuracy}%</strong></p>
          <button class="btn" onclick="closeModal(true)">Next Lesson ➔</button>
        `;
      }
    }
    modal.style.display = 'flex';
  }

  function closeModal(advance) {
    document.getElementById('lessonModal').style.display = 'none';
    if (advance && currentLessonIdx < lessons.length - 1) {
      setupLesson(currentLessonIdx + 1);
    } else {
      setupLessonUI();
    }
  }

  function downloadCSV(csvContent, fileName) {
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', fileName);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function exportAccuracySummaryCSV() {
    let csv = 'Lesson,Accuracy (%),Status\n';
    lessons.forEach(l => {
      const isDone = completedLessons.has(l.id);
      csv += `"${l.title}","${isDone ? 'Completed' : 'Incomplete'}"\n`;
    });
    downloadCSV(csv, 'Student_Accuracy_Summary.csv');
  }

  function exportMistakesLogCSV() {
    let csv = 'Lesson ID,Char Index,Expected Key,Typed Key,Time\n';
    Object.keys(lessonMistakes).forEach(key => {
      lessonMistakes[key].forEach(m => {
        csv += `"${key}","${m.index}","${m.expected}","${m.typed}","${m.time}"\n`;
      });
    });
    downloadCSV(csv, 'Student_Mistake_Log.csv');
  }

  function triggerFireworks() {
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: canvas.width / 2, y: canvas.height / 2,
        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
        radius: Math.random() * 4 + 2, alpha: 1
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.alpha -= 0.015;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(p.alpha, 0); ctx.fill();
        if (p.alpha <= 0) particles.splice(i, 1);
      });
      if (particles.length > 0) requestAnimationFrame(animate);
      else canvas.remove();
    }
    animate();
  }

  window.onload = init;
</script>
</body>
</html>
