<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet QWERTY - Mission 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&family=Fredoka+One&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --class-theme-color: #38bdf8;
      --neon-green: #22c55e;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --font-tech: 'Share Tech Mono', monospace;
      --font-header: 'Orbitron', sans-serif;
      --font-playful: 'Fredoka One', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 100%);
      color: #f8fafc; 
      font-family: 'Open Sans', sans-serif; 
      min-height: 100vh;
      padding: 20px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .game-console { 
      max-width: 800px; 
      width: 100%;
      background: rgba(19, 27, 46, 0.95); 
      border-radius: 24px; 
      padding: 25px; 
      box-shadow: 0 0 35px var(--class-theme-color); 
      border: 3px solid var(--class-theme-color); 
      position: relative;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 23, 0.8);
      padding: 12px 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title-group { display: flex; align-items: center; gap: 12px; }
    .app-title { font-family: var(--font-header); color: var(--class-theme-color); font-size: 1.3rem; font-weight: 800; }

    .lesson-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-lesson {
      font-family: var(--font-tech);
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-lesson:hover {
      border-color: var(--class-theme-color);
      color: #f8fafc;
    }

    .btn-lesson.active {
      background: var(--class-theme-color);
      color: #020617;
      border-color: var(--class-theme-color);
      box-shadow: 0 0 12px var(--class-theme-color);
    }

    /* Main Display Area */
    .lesson-content-area {
      width: 100%;
      height: 480px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    /* Standard Tutor UI */
    .standard-tutor-container {
      background: radial-gradient(circle at 50% 100%, #1e293b 0%, #030712 100%);
      border: 2px solid var(--class-theme-color);
      border-radius: 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .prompt-box {
      font-family: var(--font-tech);
      font-size: 2.2rem;
      letter-spacing: 4px;
      color: var(--class-theme-color);
      background: rgba(15, 23, 42, 0.8);
      padding: 15px 30px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tutor-input {
      font-family: var(--font-tech);
      font-size: 1.5rem;
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid var(--class-theme-color);
      background: #0f172a;
      color: #fff;
      text-align: center;
      outline: none;
      width: 250px;
    }

    /* Embedded Mini-Game Iframe */
    .game-iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 14px;
    }

    .btn-control {
      font-family: var(--font-tech);
      background: #1e293b;
      color: var(--class-theme-color);
      border: 1px solid var(--class-theme-color);
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-control:hover { background: rgba(56, 189, 248, 0.2); }
  </style>
</head>
<body onload="selectLesson(1)">

<div class="game-console">
  <div class="console-header">
    <div class="title-group">
      <span style="font-size: 1.8rem;">🚀</span>
      <span id="lessonTitleDisplay" class="app-title">Lesson 1: Index Keys</span>
    </div>
    <button class="btn-control" onclick="reloadCurrentLesson()">RESTART</button>
  </div>

  <!-- Lesson Navigation Bar -->
  <div class="lesson-nav">
    <button class="btn-lesson" id="btnLesson1" onclick="selectLesson(1)">Lesson 1: Index Keys</button>
    <button class="btn-lesson" id="btnLesson2" onclick="selectLesson(2)">Lesson 2: Inner Keys</button>
    <button class="btn-lesson" id="btnLesson3" onclick="selectLesson(3)">Lesson 3: Outer Keys</button>
    <button class="btn-lesson" id="btnLesson4" onclick="selectLesson(4)">Lesson 4: Rocket Defense</button>
  </div>

  <!-- Dynamic Content Area -->
  <div id="lessonContentArea" class="lesson-content-area"></div>
</div>

<script>
  const LESSONS = {
    1: { title: "Lesson 1: Index Keys (F & J)", type: "standard", keys: "f j f j j f f j" },
    2: { title: "Lesson 2: Inner Keys (D & K)", type: "standard", keys: "d k d k f d j k" },
    3: { title: "Lesson 3: Outer Keys (A & L)", type: "standard", keys: "a l a l s k d l" },
    4: { title: "Lesson 4: Rocket Defense", type: "game", url: "../games/rocket-defense/index.html" }
  };

  let activeLessonId = 1;

  function selectLesson(id) {
    activeLessonId = id;

    // Update active button state
    document.querySelectorAll('.btn-lesson').forEach((btn, index) => {
      btn.classList.toggle('active', (index + 1) === id);
    });

    const lesson = LESSONS[id];
    document.getElementById('lessonTitleDisplay').innerText = lesson.title;

    const area = document.getElementById('lessonContentArea');

    if (lesson.type === 'standard') {
      area.innerHTML = `
        <div class="standard-tutor-container">
          <div class="prompt-box">${lesson.keys}</div>
          <input type="text" class="tutor-input" placeholder="Type here..." autofocus />
        </div>
      `;
    } else if (lesson.type === 'game') {
      area.innerHTML = `<iframe id="gameFrame" class="game-iframe" src="${lesson.url}"></iframe>`;
    }
  }

  function reloadCurrentLesson() {
    selectLesson(activeLessonId);
  }
</script>
</body>
</html>
