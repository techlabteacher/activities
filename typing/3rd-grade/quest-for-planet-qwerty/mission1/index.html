<script>
  // Rocket Game Module
  const RocketGame = (() => {
    let active = false;
    let targetLetter = 'F';
    let destroyed = 0;
    const totalGoal = 20;
    let totalTyped = 0;
    let correctTyped = 0;
    let onCompleteCallback = null;

    const letters = ['F', 'J', 'D', 'K'];

    function init(onComplete) {
      active = true;
      destroyed = 0;
      totalTyped = 0;
      correctTyped = 0;
      onCompleteCallback = onComplete;
      updateUI();
      spawnNext();
    }

    function reset() {
      active = false;
      destroyed = 0;
    }

    function spawnNext() {
      targetLetter = letters[Math.floor(Math.random() * letters.length)];
      const rocketLetterEl = document.getElementById('rocketLetter');
      const targetRocketEl = document.getElementById('targetRocket');
      if (rocketLetterEl) rocketLetterEl.innerText = targetLetter;
      
      if (targetRocketEl) {
        const randomX = Math.floor(Math.random() * 70) + 15;
        targetRocketEl.style.left = `${randomX}%`;
      }
    }

    function handleInput(key) {
      if (!active) return undefined;

      totalTyped++;
      const pressedChar = key.toUpperCase();

      if (pressedChar === targetLetter) {
        correctTyped++;
        destroyed++;
        updateUI();

        if (destroyed >= totalGoal) {
          active = false;
          const finalAccuracy = Math.round((correctTyped / totalTyped) * 100);
          if (onCompleteCallback) onCompleteCallback(finalAccuracy);
        } else {
          spawnNext();
        }
      } else {
        const targetRocketEl = document.getElementById('targetRocket');
        if (targetRocketEl) {
          targetRocketEl.classList.add('shake');
          setTimeout(() => targetRocketEl.classList.remove('shake'), 200);
        }
      }

      return Math.round((correctTyped / totalTyped) * 100);
    }

    function updateUI() {
      const launchedEl = document.getElementById('launchedCount');
      const targetEl = document.getElementById('targetGoal');
      if (launchedEl) launchedEl.innerText = destroyed;
      if (targetEl) targetEl.innerText = totalGoal;
    }

    return { init, reset, handleInput };
  })();
</script>

<script>
  const TEACHER_PASSCODE = "8760";
  const lessons = [
    { title: "Lesson 1: F & J", text: "jjj fff jj ff fjj jjf fjf ffj jff jfj ffjfjjfjjffj", type: "typing" },
    { title: "Lesson 2: D & K", text: "kkk ddd kk dd kkd ddk dkd kdd dkk kdk dddkdkddkdkk", type: "typing" },
    { title: "Lesson 3: DFJK", text: "ff jj fj fj dd kk kd kd jk jk df df jd jd fk fk kj fd jf", type: "typing" },
    { title: "Lesson 4: Game", text: "", type: "game" },
    { title: "Lesson 5: Video", text: "", type: "video" },
    { title: "Lesson 6: Shift", text: "jJ kK J K fF dD D F jfdk J F D K", type: "typing" }
  ];

  let currentLessonIdx = 0;
  let targetText = "";
  let currentIndex = 0;
  let totalTyped = 0, correctTyped = 0;
  let errorIndices = [];
  let lessonStars = new Array(lessons.length).fill(0);
  let showKeyboard = false;
  let teacherUnlocked = false;
  let currentPasscodeMode = 'keyboard';
  
  let ytPlayer = null;
  let videoFinished = false;

  let leftShiftDown = false;
  let rightShiftDown = false;

  // Fireworks Animation System
  let fireworksActive = false;
  let particles = [];

  function launchFireworks() {
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    fireworksActive = true;
    particles = [];

    const colors = ['#22c55e', '#38bdf8', '#f59e0b', '#ec4899', '#a855f7', '#ffffff'];

    function createExplosion(x, y) {
      const particleCount = 60;
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008,
          radius: Math.random() * 3 + 2
        });
      }
    }

    let burstTimer = 0;

    function animate() {
      if (!fireworksActive) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      burstTimer++;
      if (burstTimer % 20 === 0) {
        createExplosion(
          Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
          Math.random() * canvas.height * 0.5 + canvas.height * 0.1
        );
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();

    setTimeout(() => {
      fireworksActive = false;
    }, 7000);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ShiftLeft') leftShiftDown = true;
    if (e.code === 'ShiftRight') rightShiftDown = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ShiftLeft') leftShiftDown = false;
    if (e.code === 'ShiftRight') rightShiftDown = false;
  });

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('youtubePlayer', {
      videoId: 'eKKutbjIZCQ',
      events: { 'onStateChange': onPlayerStateChange }
    });
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
      videoFinished = true;
      document.getElementById('videoFinishBtn').style.display = 'inline-block';
      document.getElementById('videoStatus').innerText = '✅ Video complete! Click continue to proceed.';
      document.getElementById('videoStatus').style.color = 'var(--neon-green)';
    }
  }

  function init() {
    loadClassProfile();
    loadProgress();
    
    renderLessonButtons();
    window.addEventListener('keydown', handleKeyPress);
    window.addEventListener('keyup', handleKeyUp);
    
    document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitPasscodeAction();
    });

    loadLesson(0);
  }

  function goToHub() {
    window.location.href = "../index.html";
  }

  function getHubKey(field) {
    const className = sessionStorage.getItem('qwerty_class_name') || 'DefaultClass';
    const compNum = sessionStorage.getItem('qwerty_computer_num') || '0';
    const safeClass = className.replace(/\s+/g, '_');
    return `qwerty_${safeClass}_comp${compNum}_mission1_${field}`;
  }

  function loadClassProfile() {
    const savedClass = sessionStorage.getItem('qwerty_class_name') || 'UNASSIGNED';
    const savedColor = sessionStorage.getItem('qwerty_class_color') || '#38bdf8';
    const savedComp = sessionStorage.getItem('qwerty_computer_num') || '--';
    
    document.documentElement.style.setProperty('--class-theme-color', savedColor);
    document.getElementById('activeClassBadge').innerText = `CLASS: ${savedClass.toUpperCase()}`;
    document.getElementById('activeCompBadge').innerText = `COMPUTER: #${savedComp}`;
  }

  function loadProgress() {
    const savedLessonStars = localStorage.getItem(getHubKey('lesson_stars'));
    if (savedLessonStars) {
      try {
        const parsed = JSON.parse(savedLessonStars);
        if (Array.isArray(parsed)) {
          lessonStars = parsed;
        }
      } catch (e) {}
    }

    if (localStorage.getItem(getHubKey('video_completed')) === 'true') {
      lessonStars[4] = Math.max(lessonStars[4], 3);
    }

    const totalStars = lessonStars.reduce((a, b) => a + b, 0);
    document.getElementById('totalStarsCount').innerText = totalStars;
  }

  function saveProgress() {
    localStorage.setItem(getHubKey('lesson_stars'), JSON.stringify(lessonStars));
    
    const totalAccumulated = lessonStars.reduce((a, b) => a + b, 0);
    
    localStorage.setItem(getHubKey('stars'), totalAccumulated);
    document.getElementById('totalStarsCount').innerText = totalAccumulated;
  }

  function checkAllLessonsCompleted() {
    return lessonStars.every(stars => stars > 0);
  }

  function renderLessonButtons() {
    const navBar = document.getElementById('lessonNavBar');
    navBar.innerHTML = '';
    lessons.forEach((l, idx) => {
      const btn = document.createElement('button');
      btn.className = `btn-lesson ${idx === currentLessonIdx ? 'active' : ''} ${lessonStars[idx] > 0 ? 'completed' : ''}`;
      btn.innerHTML = `${lessonStars[idx] > 0 ? '✔ ' : ''}${l.title}`;
      btn.onclick = () => loadLesson(idx);
      navBar.appendChild(btn);
    });
  }

  function loadLesson(idx) {
    currentLessonIdx = idx;
    renderLessonButtons();
    const lesson = lessons[currentLessonIdx];

    document.getElementById('standardTextDisplay').style.display = 'none';
    document.getElementById('skyGameDisplay').style.display = 'none';
    document.getElementById('videoDisplay').style.display = 'none';

    updateKeyboardDisplayState();

    if (lesson.type === "game") {
      document.getElementById('skyGameDisplay').style.display = 'block';
      RocketGame.init((acc) => showCompletionModal(acc));
    } else if (lesson.type === "video") {
      document.getElementById('videoDisplay').style.display = 'flex';
      setupVideoState();
    } else {
      targetText = lesson.text;
      document.getElementById('standardTextDisplay').style.display = 'flex';
    }
    resetLessonStateOnly();
  }

  function setupVideoState() {
    const isAlreadyWatched = localStorage.getItem(getHubKey('video_completed')) === 'true';
    if (isAlreadyWatched) {
      videoFinished = true;
      document.getElementById('videoFinishBtn').style.display = 'inline-block';
      document.getElementById('videoStatus').innerText = '✅ Video already watched! Click continue to proceed.';
      document.getElementById('videoStatus').style.color = 'var(--neon-green)';
    } else {
      videoFinished = false;
      document.getElementById('videoFinishBtn').style.display = 'none';
      document.getElementById('videoStatus').innerText = '🔒 Watch the full video to continue...';
      document.getElementById('videoStatus').style.color = 'var(--neon-amber)';
      if (ytPlayer && ytPlayer.seekTo) {
        ytPlayer.seekTo(0);
        ytPlayer.stopVideo();
      }
    }
  }

  function resetLessonStateOnly() {
    RocketGame.reset();
    currentIndex = 0; totalTyped = 0; correctTyped = 0; errorIndices = [];
    updateAccuracyMeter(100);
    document.getElementById('completionModal').classList.remove('active');
    
    if (lessons[currentLessonIdx].type === 'game') {
      RocketGame.init((acc) => showCompletionModal(acc));
    } else if (lessons[currentLessonIdx].type === 'video') {
      setupVideoState();
    } else {
      updateTargetAndKeyboard();
    }
  }

  function updateAccuracyMeter(acc) {
    document.getElementById('accuracyMeterFill').style.width = `${acc}%`;
    const txt = document.getElementById('accuracyVal');
    txt.innerText = `${acc}%`;
    txt.style.color = acc >= 90 ? 'var(--neon-green)' : (acc >= 80 ? 'var(--neon-amber)' : 'var(--neon-red)');
  }

  function updateTargetAndKeyboard() {
    document.querySelectorAll('.k').forEach(k => k.classList.remove('active'));
    if (currentIndex >= targetText.length) return;

    const currentChar = targetText[currentIndex];
    const container = document.getElementById('textNodesContainer');
    container.innerHTML = '';
    
    for (let i = 0; i < targetText.length; i++) {
      const span = document.createElement('span');
      span.className = 'char-node';
      if (targetText[i] === ' ') {
        span.classList.add('space-node');
        span.innerHTML = '&nbsp;';
      } else {
        span.innerText = targetText[i];
      }
      
      if (i < currentIndex) span.classList.add(errorIndices.includes(i) ? 'char-error' : 'char-done');
      else if (i === currentIndex) span.classList.add('char-current');
      container.appendChild(span);
    }

    const isKbVisible = (currentLessonIdx === 5 || showKeyboard);
    if (isKbVisible) {
      let keyId = currentChar === ' ' ? 'key-space' : `key-${currentChar.toLowerCase()}`;
      const activeKey = document.getElementById(keyId);
      if (activeKey) activeKey.classList.add('active');

      if (currentChar === currentChar.toUpperCase() && currentChar !== ' ' && currentChar !== ';') {
        const isRightHand = ['j', 'k', 'l', ';'].includes(currentChar.toLowerCase());
        const shiftKey = isRightHand ? document.getElementById('key-shiftleft') : document.getElementById('key-shiftright');
        if (shiftKey) shiftKey.classList.add('active');
      }
    }
  }

  function handleKeyPress(e) {
    if (document.getElementById('passcodeModal').classList.contains('active')) return;
    if (e.key === ' ') e.preventDefault();
    
    let keyId = e.key === ' ' ? 'key-space' : `key-${e.key.toLowerCase()}`;
    let pressedKeyEl = document.getElementById(keyId);
    if (pressedKeyEl) pressedKeyEl.classList.add('pressed');

    if (e.key === 'Enter' && document.getElementById('completionModal').classList.contains('active')) {
      handleModalAction(); return;
    }

    if (lessons[currentLessonIdx].type === 'game') {
      const accuracy = RocketGame.handleInput(e.key);
      if (accuracy !== undefined) updateAccuracyMeter(accuracy);
      return;
    }

    if (lessons[currentLessonIdx].type === 'video' || e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;

    const expectedChar = targetText[currentIndex];
    const isUppercaseExpected = (expectedChar === expectedChar.toUpperCase() && expectedChar !== ' ' && expectedChar !== ';');

    let isValid = false;
    const isLesson6 = (currentLessonIdx === 5);

    if (isUppercaseExpected && isLesson6) {
      const isRightHandLetter = ['j', 'k', 'l', ';', 'u', 'i', 'o', 'p', 'h', 'n', 'm'].includes(expectedChar.toLowerCase());
      const usedCorrectShift = isRightHandLetter ? leftShiftDown : rightShiftDown;

      isValid = (e.key === expectedChar && usedCorrectShift);
    } else if (isUppercaseExpected) {
      isValid = (e.shiftKey && e.key === expectedChar);
    } else {
      isValid = (e.key === expectedChar);
    }

    totalTyped++;
    if (isValid) {
      correctTyped++;
      currentIndex++;
    } else {
      errorIndices.push(currentIndex);
      if (currentLessonIdx < 3) currentIndex++;
    }

    const acc = Math.round((correctTyped / totalTyped) * 100);
    updateAccuracyMeter(acc);
    updateTargetAndKeyboard();
    if (currentIndex >= targetText.length) showCompletionModal(acc);
  }

  function handleKeyUp(e) {
    let keyId = e.key === ' ' ? 'key-space' : `key-${e.key.toLowerCase()}`;
    let pressedKeyEl = document.getElementById(keyId);
    if (pressedKeyEl) pressedKeyEl.classList.remove('pressed');
  }

  function toggleKeyboardVisibility() {
    if (showKeyboard) {
      showKeyboard = false;
      teacherUnlocked = false;
      updateKeyboardDisplayState();
    } else {
      if (teacherUnlocked) {
        showKeyboard = true;
        updateKeyboardDisplayState();
      } else {
        openPasscodeModal('keyboard');
      }
    }
  }

  function openTeacherResetModal() {
    openPasscodeModal('reset');
  }

  function openPasscodeModal(mode) {
    currentPasscodeMode = mode;
    document.getElementById('passcodeInput').value = '';
    document.getElementById('passcodeError').innerText = '';
    
    const titleEl = document.getElementById('passcodeModalTitle');
    const subtextEl = document.getElementById('passcodeModalSubtext');

    if (mode === 'reset') {
      titleEl.innerText = "TEACHER RESET";
      subtextEl.innerText = `Enter passcode to reset ${lessons[currentLessonIdx].title}:`;
    } else {
      titleEl.innerText = "TEACHER VERIFICATION";
      subtextEl.innerText = "Enter passcode to enable on-screen keyboard:";
    }

    document.getElementById('passcodeModal').classList.add('active');
    setTimeout(() => document.getElementById('passcodeInput').focus(), 100);
  }

  function closePasscodeModal() {
    document.getElementById('passcodeModal').classList.remove('active');
  }

  function handleBackdropClick(e) {
    if (e.target.id === 'passcodeModal') closePasscodeModal();
  }

  function submitPasscodeAction() {
    if (document.getElementById('passcodeInput').value === TEACHER_PASSCODE) {
      closePasscodeModal();
      if (currentPasscodeMode === 'keyboard') {
        teacherUnlocked = true;
        showKeyboard = true;
        updateKeyboardDisplayState();
      } else if (currentPasscodeMode === 'reset') {
        lessonStars[currentLessonIdx] = 0;
        if (currentLessonIdx === 4) {
          localStorage.removeItem(getHubKey('video_completed'));
        }
        saveProgress();
        renderLessonButtons();
        resetLessonStateOnly();
      }
    } else {
      document.getElementById('passcodeError').innerText = 'Incorrect Passcode';
    }
  }

  function updateKeyboardDisplayState() {
    const isLesson6 = (currentLessonIdx === 5);
    const shouldDisplay = (isLesson6 || showKeyboard) && (lessons[currentLessonIdx].type !== 'video');
    document.getElementById('kbToggleText').innerText = isLesson6 ? 'ON (FORCED)' : (showKeyboard ? 'ON' : 'OFF');
    document.getElementById('keyboardWrapper').style.display = shouldDisplay ? 'block' : 'none';
  }

  function completeVideoLesson() { 
    if (videoFinished) {
      localStorage.setItem(getHubKey('video_completed'), 'true');
      showCompletionModal(100); 
    }
  }

  function showCompletionModal(accuracy) {
    let starsEarned = 0;
    if (accuracy >= 80 && accuracy <= 84) starsEarned = 1;
    else if (accuracy >= 85 && accuracy <= 89) starsEarned = 2;
    else if (accuracy >= 90) starsEarned = 3;

    if (accuracy >= 80) {
      lessonStars[currentLessonIdx] = Math.max(lessonStars[currentLessonIdx], starsEarned);
      saveProgress();
      renderLessonButtons();
    }

    // Set lesson star display
    const star1 = document.getElementById('star1');
    const star2 = document.getElementById('star2');
    const star3 = document.getElementById('star3');

    if (star1) star1.className = `star ${starsEarned >= 1 ? 'filled' : ''}`;
    if (star2) star2.className = `star ${starsEarned >= 2 ? 'filled' : ''}`;
    if (star3) star3.className = `star ${starsEarned >= 3 ? 'filled' : ''}`;

    const titleEl = document.getElementById('modalTitle');
    const bodyTextEl = document.getElementById('modalBodyText');
    const nextBtn = document.getElementById('nextLessonBtn');
    
    const isLastLesson = (currentLessonIdx === lessons.length - 1);
    const totalAccumulatedStars = lessonStars.reduce((a, b) => a + b, 0);

    if (isLastLesson) {
      titleEl.innerText = "🎉 MISSION 1 COMPLETE! 🎉";
      bodyTextEl.innerHTML = `Lesson Accuracy: <strong>${accuracy}%</strong><br>Total Mission Stars Earned: <strong style="color:var(--neon-amber);">${totalAccumulatedStars} / 18</strong>`;
      nextBtn.innerText = "Return to Hub 🚀";
      launchFireworks();
    } else {
      titleEl.innerText = "LESSON ACCOMPLISHED";
      bodyTextEl.innerHTML = `Accuracy: <strong>${accuracy}%</strong>`;
      nextBtn.innerText = "Next Lesson ➔";
    }

    document.getElementById('completionModal').classList.add('active');
  }

  function handleModalAction() {
    document.getElementById('completionModal').classList.remove('active');
    if (currentLessonIdx < lessons.length - 1) {
      currentLessonIdx++;
      loadLesson(currentLessonIdx);
    } else {
      goToHub();
    }
  }
</script>
</body>
</html>
