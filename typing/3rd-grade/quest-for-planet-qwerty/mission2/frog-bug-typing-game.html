<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frog Bug Typing Game</title>
  <style>
    body {
      margin: 0;
      background: #81c784; /* Pond grass green */
      font-family: Arial, sans-serif;
      overflow: hidden;
      color: white;
      user-select: none;
    }
    #game-bar {
      display: flex;
      justify-content: space-around;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 22px;
      font-weight: bold;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 140px);
    }
    .bug {
      position: absolute;
      width: 50px;
      height: 50px;
      background: #e57373; /* Bug body color */
      border: 3px solid #b71c1c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    #frog {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 60px;
      background: #388e3c;
      border-radius: 40px 40px 10px 10px;
      text-align: center;
      line-height: 60px;
      font-size: 35px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-bar">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
    <div>Queue Left: <span id="remaining">0</span></div>
  </div>

  <div id="game-container"></div>
  <div id="frog">🐸</div>

  <script>
    const container = document.getElementById('game-container');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const remainingEl = document.getElementById('remaining');

    // Custom letter sequence setup
    const letterSequence = "sjslklfsldlsjdflskjfkjlsdsSlL".split('');
    let sequenceIndex = 0;

    let score = 0;
    let lives = 3;
    let bugs = [];

    remainingEl.innerText = letterSequence.length;

    function createBug() {
      if (lives <= 0 || sequenceIndex >= letterSequence.length) return;

      const char = letterSequence[sequenceIndex++];
      remainingEl.innerText = letterSequence.length - sequenceIndex;

      const bugEl = document.createElement('div');
      bugEl.className = 'bug';
      bugEl.innerText = char;

      const startX = Math.random() * (window.innerWidth - 70);
      let posY = 0; // Bugs crawl down from the top toward the frog

      bugEl.style.left = startX + 'px';
      bugEl.style.top = posY + 'px';
      container.appendChild(bugEl);

      bugs.push({
        element: bugEl,
        char: char,
        x: startX,
        y: posY,
        speed: 1 + Math.random() * 1.2
      });
    }

    function updateGame() {
      const maxY = container.clientHeight - 50;

      for (let i = bugs.length - 1; i >= 0; i--) {
        const bug = bugs[i];
        bug.y += bug.speed;
        bug.element.style.top = bug.y + 'px';

        // Bug reaches bottom (escapes frog)
        if (bug.y > maxY) {
          bug.element.remove();
          bugs.splice(i, 1);
          lives--;
          livesEl.innerText = lives;

          if (lives <= 0) {
            alert('Game Over! Final Score: ' + score);
            window.location.reload();
          }
        }
      }

      // Win Condition Check
      if (bugs.length === 0 && sequenceIndex >= letterSequence.length && lives > 0) {
        alert('You Win! You caught all the target bugs!');
        window.location.reload();
      }
    }

    // Keypress Handler (Case-sensitive)
    window.addEventListener('keydown', (e) => {
      if (e.key.length !== 1) return; // Ignore control keys

      const typedChar = e.key;
      
      // Find lowest matching bug on screen matching exact case
      let lowestBugIndex = -1;
      let maxY = -1;

      bugs.forEach((bug, index) => {
        if (bug.char === typedChar && bug.y > maxY) {
          maxY = bug.y;
          lowestBugIndex = index;
        }
      });

      if (lowestBugIndex !== -1) {
        bugs[lowestBugIndex].element.remove();
        bugs.splice(lowestBugIndex, 1);
        score += 10;
        scoreEl.innerText = score;
      }
    });

    // Game Loops
    const spawnInterval = setInterval(createBug, 1200);
    const gameInterval = setInterval(updateGame, 1000 / 60);
  </script>
</body>
</html>
