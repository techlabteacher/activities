<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedway Type Racer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    #game-container {
      width: 80%;
      max-width: 800px;
      background: #2b2b3d;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    #track-container {
      position: relative;
      width: 100%;
      height: 80px;
      background: #44445a;
      border-bottom: 4px dashed #ffffff;
      margin-bottom: 20px;
      overflow: hidden;
      border-radius: 5px;
    }

    #car {
      position: absolute;
      bottom: 10px;
      left: 0;
      font-size: 40px;
      transition: left 0.1s ease-out;
    }

    #target-display {
      font-size: 24px;
      font-family: monospace;
      background: #181825;
      padding: 15px;
      border-radius: 5px;
      letter-spacing: 2px;
      word-wrap: break-word;
    }

    .correct {
      color: #a6e3a1;
    }

    .incorrect {
      color: #f38ba8;
      text-decoration: underline;
    }

    .current {
      background-color: #89b4fa;
      color: #11111b;
      border-radius: 3px;
    }

    #stats-display {
      margin-top: 15px;
      font-size: 18px;
      color: #cdd6f4;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h2>Speedway Type Racer</h2>
    <div id="track-container">
      <div id="car">🏎️</div>
    </div>
    <div id="target-display"></div>
    <div id="stats-display">Type the text above to start racing!</div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const studentClass = urlParams.get('class') || '';
      const studentComp = urlParams.get('comp') || '';

      const targetText = "fff jjj fjj ffj jfj jjf jff fjfj jfj ff jj";
      let currentIndex = 0;
      let totalTyped = 0;
      let correctTyped = 0;
      let startTime = null;
      let idleTimer = null;
      let isFinished = false;

      const trackContainer = document.getElementById("track-container");
      const targetDisplay = document.getElementById("target-display");
      const statsDisplay = document.getElementById("stats-display");
      const car = document.getElementById("car");

      function renderText() {
        targetDisplay.innerHTML = "";
        for (let i = 0; i < targetText.length; i++) {
          const span = document.createElement("span");
          span.textContent = targetText[i] === " " ? "\u00A0" : targetText[i];
          if (i < currentIndex) {
            span.className = "correct";
          } else if (i === currentIndex) {
            span.className = "current";
          }
          targetDisplay.appendChild(span);
        }
      }

      function updateCarPosition() {
        const trackWidth = trackContainer.clientWidth - car.clientWidth - 40;
        const progress = currentIndex / targetText.length;
        car.style.left = `${progress * trackWidth}px`;
      }

      function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (!isFinished) {
          idleTimer = setTimeout(() => {
            endGame(false, "Time's Up!");
          }, 10000);
        }
      }

      function endGame(completed, message) {
        isFinished = true;
        clearTimeout(idleTimer);

        const accuracy = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 0;
        
        let stars = 1;
        if (accuracy >= 95) stars = 3;
        else if (accuracy >= 80) stars = 2;

        statsDisplay.textContent = message || `Finished! Accuracy: ${accuracy}%`;

        if (studentClass && studentComp) {
          const storageKey = `mission2_hub_${studentClass}_${studentComp}`;
          let data = {};
          try {
            data = JSON.parse(localStorage.getItem(storageKey)) || {};
          } catch(e) {}
          
          data.stars = data.stars || {};
          data.stars[6] = Math.max(data.stars[6] || 0, stars);
          data.completed = data.completed || {};
          data.completed[6] = true;
          
          localStorage.setItem(storageKey, JSON.stringify(data));
          
          sessionStorage.setItem("last_lesson_result", JSON.stringify({
            lessonId: 6,
            stars: stars,
            accuracy: accuracy
          }));
        }

        setTimeout(() => {
          window.location.href = `index.html?class=${encodeURIComponent(studentClass)}&comp=${encodeURIComponent(studentComp)}`;
        }, 1500);
      }

      window.addEventListener("keydown", (e) => {
        if (isFinished) return;

        if (e.key.length === 1 || e.key === " ") {
          if (!startTime) startTime = Date.now();
          resetIdleTimer();

          totalTyped++;
          const expectedChar = targetText[currentIndex];

          if (e.key === expectedChar) {
            correctTyped++;
            currentIndex++;
            renderText();
            updateCarPosition();

            if (currentIndex >= targetText.length) {
              endGame(true, "Race Complete!");
            }
          } else {
            if (targetDisplay.children[currentIndex]) {
              targetDisplay.children[currentIndex].classList.add("incorrect");
            }
          }
        }
      });

      renderText();
    })();
  </script>
</body>
</html>
