<div id="racecar-game" style="width:100%; max-width:940px; margin:0 auto; box-sizing:border-box;">
  <style>
    #racecar-game * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    #racecar-game .game-card {
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
      box-shadow: 0 25px 40px rgba(0,0,0,0.8);
      outline: none;
    }

    #racecar-game .game-header {
      background: #090d16;
      padding: 12px 22px;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }

    #racecar-game .game-title {
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    #racecar-game .control-panel {
      padding: 14px 22px;
      background: #1e293b;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #334155;
    }

    #racecar-game .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #racecar-game label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 4px;
    }

    #racecar-game .btn-level {
      border: 2px solid transparent;
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.65;
    }

    #racecar-game .btn-level:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    #racecar-game .btn-level.active {
      opacity: 1;
      box-shadow: 0 0 12px currentColor;
      transform: scale(1.05);
    }

    #racecar-game .btn-easy {
      background: linear-gradient(135deg, #10b981, #047857);
      color: #a7f3d0;
      border-color: #34d399;
    }

    #racecar-game .btn-medium {
      background: linear-gradient(135deg, #f59e0b, #b45309);
      color: #fde68a;
      border-color: #fbbf24;
    }

    #racecar-game .btn-hard {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fca5a5;
      border-color: #f87171;
    }

    #racecar-game .btn-action {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: all 0.2s ease;
    }

    #racecar-game .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5);
    }

    #racecar-game .btn-restart {
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    #racecar-game .track-wrapper {
      position: relative;
      height: 340px;
      background: #0f172a;
      overflow: hidden;
    }

    #racecar-game .speedway {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #18181b;
      border-top: 6px solid #f59e0b;
      border-bottom: 6px solid #f59e0b;
    }

    #racecar-game .lane {
      position: relative;
      height: 33.33%;
      border-bottom: 2px dashed rgba(255,255,255,0.25);
    }
    #racecar-game .lane:last-child { border-bottom: none; }

    #racecar-game .bridge-sign {
      position: absolute;
      top: 0; bottom: 0; width: 40px; left: 120%;
      background: linear-gradient(90deg, #334155, #0f172a, #334155);
      border-left: 3px solid #fbbf24; border-right: 3px solid #fbbf24;
      box-shadow: -10px 0 20px rgba(0,0,0,0.8), 10px 0 20px rgba(0,0,0,0.8);
      z-index: 20; display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }

    #racecar-game .bridge-text {
      writing-mode: vertical-rl; color: #fbbf24;
      font-weight: 900; font-size: 0.75rem;
      letter-spacing: 4px; text-transform: uppercase;
    }

    #racecar-game .finish-line {
      position: absolute; right: -100px; top: 0; bottom: 0; width: 32px;
      background: repeating-linear-gradient(0deg, #fff, #fff 16px, #000 16px, #000 32px);
      box-shadow: 0 0 20px rgba(255,255,255,0.8); z-index: 10;
    }

    #racecar-game .pothole {
      position: absolute; width: 45px; height: 24px;
      background: #090d16; border-radius: 50%; border: 2px solid #27272a;
      pointer-events: none;
    }

    #racecar-game .rock {
      position: absolute; width: 20px; height: 16px;
      background: #52525b; border-radius: 4px; box-shadow: 2px 2px 0px #000;
      pointer-events: none;
    }

    #racecar-game .car-container {
      position: absolute; left: 300px; top: 12px; width: 140px; height: 75px;
      will-change: left; z-index: 15;
    }

    #racecar-game .car-label {
      position: absolute; top: -16px; left: 10px;
      background: rgba(0,0,0,0.85); color: #fff;
      padding: 1px 8px; border-radius: 4px;
      font-size: 0.7rem; font-weight: bold; border: 1px solid #334155; z-index: 25;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    #racecar-game .typing-display {
      background: #030712; padding: 18px 20px; text-align: center;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 1.8rem; font-weight: 800; white-space: normal;
      word-break: break-word; user-select: none; min-height: 85px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      border-top: 3px solid #1e293b; border-bottom: 3px solid #1e293b;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8); line-height: 1.4;
      transition: border-color 0.3s ease;
      letter-spacing: -0.5px;
    }

    #racecar-game .game-card:focus .typing-display {
      border-top-color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    #racecar-game .char {
      color: #475569; padding: 1px 2px; border-radius: 3px;
      transition: all 0.15s ease; display: inline-block;
      margin: 0; border: 1px solid transparent;
    }

    #racecar-game .char-space { width: 12px; }
    #racecar-game .char.correct { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.6); }
    
    #racecar-game .char.incorrect { 
      color: #ffffff; 
      background: #dc2626; 
      border: 1px solid #ef4444;
      border-radius: 3px; 
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.6);
    }
    
    #racecar-game .char.active { 
      color: #facc15; 
      background: rgba(250, 204, 21, 0.2); 
      border-bottom: 2px solid #facc15;
      transform: scale(1.08); 
    }

    #racecar-game .dashboard-panel {
      background: linear-gradient(180deg, #090d16 0%, #020617 100%);
      padding: 20px;
      border-top: 2px solid #334155;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.9);
    }

    #racecar-game .gauge-cluster {
      display: flex;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 780px;
      justify-content: space-around;
    }

    #racecar-game .gauge {
      position: relative;
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, #1e293b 0%, #090d16 70%);
      border-radius: 50%;
      border: 4px solid #334155;
      box-shadow: 0 0 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #racecar-game .gauge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #racecar-game .gauge-bg {
      fill: none;
      stroke: #1e293b;
      stroke-width: 8;
    }

    #racecar-game .gauge-value {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 8;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }

    #racecar-game .gauge-needle {
      position: absolute;
      width: 2px;
      height: 48px;
      background: #f43f5e;
      bottom: 50%;
      left: calc(50% - 1px);
      transform-origin: bottom center;
      transform: rotate(-120deg);
      transition: transform 0.3s ease-out;
      box-shadow: 0 0 6px #f43f5e;
      z-index: 5;
    }

    #racecar-game .gauge-cap {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #f8fafc;
      border-radius: 50%;
      border: 3px solid #0f172a;
      z-index: 6;
    }

    #racecar-game .gauge-title {
      position: absolute;
      bottom: 18px;
      font-size: 0.65rem;
      font-weight: 900;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #racecar-game .gauge-readout {
      position: absolute;
      top: 25px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
      font-family: 'Consolas', monospace;
    }

    #racecar-game .digital-hud {
      background: #000;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 12px 24px;
      text-align: center;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
      min-width: 180px;
    }

    #racecar-game .digital-rank {
      font-size: 1.8rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
      margin-bottom: 2px;
    }

    #racecar-game .digital-lbl {
      font-size: 0.65rem;
      color: #64748b;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #racecar-game .modal-overlay {
      position: absolute; inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: flex; justify-content: center; align-items: center;
      z-index: 50;
    }

    #racecar-game .modal {
      background: #1e293b; padding: 30px; border-radius: 20px;
      width: 90%; max-width: 580px; text-align: center;
      border: 1px solid #475569; box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      position: relative;
    }

    #racecar-game .finish-btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    #racecar-game .finish-btn-group .btn-level {
      flex: 1;
      padding: 12px 8px;
      font-size: 0.95rem;
      opacity: 1;
    }

    #racecar-game .countdown-overlay {
      position: absolute; inset: 0;
      background: rgba(2, 6, 23, 0.75);
      display: none; justify-content: center; align-items: center;
      z-index: 40;
    }

    #racecar-game .countdown-number {
      font-size: 6rem; font-weight: 900; color: #38bdf8;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
      animation: popIn 0.8s ease infinite;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    #racecar-game .car-options {
      display: flex; gap: 14px; justify-content: center; margin: 20px 0;
    }

    #racecar-game .car-card {
      flex: 1; background: #0f172a; border: 2px solid #334155;
      border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    #racecar-game .car-card:hover {
      transform: translateY(-4px);
      border-color: #64748b;
    }

    #racecar-game .car-card.selected {
      border-color: #38bdf8; background: #1e293b;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    #racecar-game .car-preview-svg {
      width: 100px; height: 50px; margin-bottom: 8px;
    }

    #racecar-game .winner-car-preview {
      position: relative; width: 140px; height: 75px; margin: 15px auto; transform: scale(1.1);
    }

    #racecar-game #confettiCanvas {
      position: absolute; inset: 0; pointer-events: none; z-index: 60;
    }

    .trophy-icon { width: 64px; height: 64px; margin: 0 auto 10px auto; display: block; }
  </style>

            <strong style="font-size:0.8rem; color:#fff;">Blue Volt</strong>
          </div>

          <div class="car-card" data-racename="Nitro" data-main="#ca8a04" data-stripe="#fef08a">
            <svg class="car-preview-svg" viewBox="0 0 140 70">
              <path d="M 12 18 L 8 12 L 20 12 L 18 18 Z" fill="#020617"/>
              <path d="M 12 52 L 8 58 L 20 58 L 18 52 Z" fill="#020617"/>
              <rect x="5" y="10" width="8" height="50" rx="3" fill="#020617"/>
              <path d="M 15 22 C 15 14, 30 10, 55 10 L 95 12 C 120 14, 134 22, 138 35 C 134 48, 120 56, 95 58 L 55 60 C 30 60, 15 56, 15 48 Z" fill="#ca8a04"/>
              <path d="M 22 31 L 128 31 L 128 39 L 22 39 Z" fill="#fef08a"/>
              <path d="M 58 18 C 72 18, 92 20, 98 35 C 92 50, 72 52, 58 52 Z" fill="#090d16"/>
              <path d="M 62 21 C 72 21, 88 23, 92 35 C 88 47, 72 49, 62 49 Z" fill="#fde047" opacity="0.75"/>
            </svg>
            <strong style="font-size:0.8rem; color:#fff;">Gold Nitro</strong>
          </div>
        </div>
        <button class="btn-action" id="startRaceBtn" style="width:100%; font-size:1.1rem; padding:12px;">Start Race</button>
      </div>
    </div>

    <div class="modal-overlay" id="victoryModal" style="display: none;">
      <div class="modal">
        <div id="modalIconContainer">
          <svg class="trophy-icon" id="trophyIcon" viewBox="0 0 24 24" fill="none">
            <path d="M5 3H19V5C19 7.76142 16.7614 10 14 10H10C7.23858 10 5 7.76142 5 5V3Z" fill="#FACC15" stroke="#EAB308" stroke-width="1.5"/>
            <path d="M12 10V17M8 21H16M8 17H16" stroke="#EAB308" stroke-width="2" stroke-linecap="round"/>
            <path d="M5 4H3V6C3 7.65685 4.34315 9 6 9H17M19 4H21V6C21 7.65685 19.6569 9 18 9H17" stroke="#FACC15" stroke-width="2"/>
          </svg>
        </div>

        <h1 id="winnerTitle" style="color:#facc15; font-size:2rem; margin-bottom: 5px;">1st Place!</h1>
        <p id="winnerSubtitle" style="color:#f8fafc; font-size:1rem; margin-bottom: 10px;">You crossed the finish line!</p>

        <div id="winnerCarContainer" class="winner-car-preview"></div>

        <div style="background:#0f172a; padding:15px; border-radius:12px; display:flex; justify-content:space-around; margin:15px 0; border:1px solid #334155;">
          <div><div id="finalAcc" style="font-size:1.5rem; font-weight:bold; color:#4ade80;">100%</div><div style="font-size:0.75rem; color:#94a3b8;">ACCURACY</div></div>
          <div><div id="finalWpm" style="font-size:1.5rem; font-weight:bold; color:#38bdf8;">0</div><div style="font-size:0.75rem; color:#94a3b8;">WPM</div></div>
        </div>

        <div style="margin-top: 15px;">
          <p style="color:#94a3b8; font-size:0.85rem; font-weight:bold; margin-bottom:8px; text-transform:uppercase;">Try Again - Choose Level:</p>
          <div class="finish-btn-group">
            <button class="btn-level btn-easy finish-level-btn" data-difficulty="easy">Easy</button>
            <button class="btn-level btn-medium finish-level-btn" data-difficulty="medium">Medium</button>
            <button class="btn-level btn-hard finish-level-btn" data-difficulty="hard">Hard</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const targetText = "fff jjj fjj ffj jfj jjf jff fjfj jfj ff jj";

      let currentIndex = 0;
      let keystrokes = 0;
      let errors = 0;
      let startTime = null;
      let isRacing = false;
      let countdownActive = false;
      let countdownTimer = null;
      let idleTimer = null;
      let currentDifficulty = "easy";
      
      const START_X = 300;
      let playerVisualPos = START_X;
      let ai1VisualPos = START_X;
      let ai2VisualPos = START_X;

      let raceTicks = 0;
      
      let bridgePos = 900;
      let finishLinePos = -150;
      let isCrossingFinish = false;
      
      let animFrame = null;
      let selectedRaceName = "Flare";
      let selectedMain = "#dc2626";
      let selectedStripe = "#ffffff";

      const container = document.getElementById('racecar-game');
      const gameArea = container.querySelector('#gameArea');
      const typingDisplay = container.querySelector('#typingDisplay');
      const carModal = container.querySelector('#carModal');
      const victoryModal = container.querySelector('#victoryModal');
      const countdownOverlay = container.querySelector('#countdownOverlay');
      const countdownVal = container.querySelector('#countdownVal');
      const playerCar = container.querySelector('#playerCar');
      const playerCarLabel = container.querySelector('#playerCarLabel');
      const ai1Car = container.querySelector('#ai1Car');
      const ai2Car = container.querySelector('#ai2Car');
      const finishLine = container.querySelector('#finishLine');
      const bridgeSign = container.querySelector('#bridgeSign');
      const accuracyVal = container.querySelector('#accuracyVal');
      const wpmVal = container.querySelector('#wpmVal');
      const rankVal = container.querySelector('#rankVal');
      const winnerCarContainer = container.querySelector('#winnerCarContainer');

      const wpmNeedle = container.querySelector('#wpmNeedle');
      const accNeedle = container.querySelector('#accNeedle');
      const wpmGaugeCircle = container.querySelector('#wpmGaugeCircle');
      const accGaugeCircle = container.querySelector('#accGaugeCircle');

      const confettiCanvas = document.getElementById('confettiCanvas');
      const ctx = confettiCanvas.getContext('2d');
      let confettiParticles = [];

      function sendDataToMission2(accValue, wpmValue, rankValue) {
        const payload = {
          type: 'RACE_GAME_COMPLETE',
          accuracy: accValue,
          wpm: wpmValue,
          rank: rankValue
        };
        
        window.postMessage(payload, '*');
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      }

      function setDifficulty(diff) {
        currentDifficulty = diff;
        container.querySelectorAll('.control-panel .btn-level').forEach(btn => {
          if (btn.getAttribute('data-difficulty') === diff) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }

      container.querySelectorAll('.control-panel .btn-level').forEach(btn => {
        btn.addEventListener('click', () => {
          setDifficulty(btn.getAttribute('data-difficulty'));
          startCountdown();
        });
      });

      container.querySelectorAll('.finish-level-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setDifficulty(btn.getAttribute('data-difficulty'));
          startCountdown();
        });
      });

      function resetIdleTimer() {
        if (idleTimer) clearTimeout(idleTimer);
        if (!isRacing) return;
        
        idleTimer = setTimeout(() => {
          if (isRacing) {
            stopGameDueToInactivity();
          }
        }, 10000);
      }

      function stopGameDueToInactivity() {
        isRacing = false;
        cancelAnimationFrame(animFrame);
        if (idleTimer) clearTimeout(idleTimer);

        const winnerTitle = container.querySelector('#winnerTitle');
        const winnerSubtitle = container.querySelector('#winnerSubtitle');

        rankVal.textContent = '---';
        winnerTitle.textContent = "Time's Up!";
        winnerTitle.style.color = '#ef4444';
        winnerSubtitle.textContent = "The race stopped due to 10 seconds of inactivity.";

        winnerCarContainer.innerHTML = playerCar.outerHTML;
        const modalCar = winnerCarContainer.querySelector('.car-container');
        if (modalCar) {
          modalCar.style.left = '0'; 
          modalCar.style.top = '0';
          const modalCarLabel = modalCar.querySelector('.car-label');
          if (modalCarLabel) modalCarLabel.remove();
        }

        const finalAccNum = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
        const finalWpmNum = parseInt(wpmVal.textContent, 10) || 0;

        container.querySelector('#finalAcc').textContent = accuracyVal.textContent;
        container.querySelector('#finalWpm').textContent = wpmVal.textContent;

        sendDataToMission2(finalAccNum, finalWpmNum, 'DNF');

        victoryModal.style.display = 'flex';
      }

      function launchConfetti() {
        confettiCanvas.width = container.clientWidth;
        confettiCanvas.height = container.clientHeight;
        confettiParticles = [];
        for (let i = 0; i < 80; i++) {
          confettiParticles.push({
            x: confettiCanvas.width / 2,
            y: confettiCanvas.height / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12 - 4,
            size: Math.random() * 8 + 4,
            color: ['#facc15', '#4ade80', '#38bdf8', '#f43f5e', '#a855f7'][Math.floor(Math.random() * 5)]
          });
        }
        animateConfetti();
      }

      function animateConfetti() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiParticles.forEach((p) => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.2;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        confettiParticles = confettiParticles.filter(p => p.y < confettiCanvas.height);
        if (confettiParticles.length > 0) requestAnimationFrame(animateConfetti);
      }

      container.querySelectorAll('.car-card').forEach(card => {
        card.addEventListener('click', () => {
          container.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedRaceName = card.getAttribute('data-racename');
          selectedMain = card.getAttribute('data-main');
          selectedStripe = card.getAttribute('data-stripe');
        });
      });

      container.querySelector('#openGarageBtn').addEventListener('click', () => {
        isRacing = false;
        cancelAnimationFrame(animFrame);
        if (countdownTimer) clearInterval(countdownTimer);
        if (idleTimer) clearTimeout(idleTimer);
        countdownOverlay.style.display = 'none';
        victoryModal.style.display = 'none';
        carModal.style.display = 'flex';
      });

      container.querySelector('#restartBtn').addEventListener('click', () => startCountdown());

      container.querySelector('#startRaceBtn').addEventListener('click', () => {
        carModal.style.display = 'none';
        playerCarLabel.textContent = selectedRaceName;
        container.querySelector('#playerBodyMain').setAttribute('fill', selectedMain);
        container.querySelector('#playerStripe').setAttribute('fill', selectedStripe);
        startCountdown();
      });

      function startCountdown() {
        isRacing = false;
        cancelAnimationFrame(animFrame);
        if (countdownTimer) clearInterval(countdownTimer);
        if (idleTimer) clearTimeout(idleTimer);
        
        countdownActive = true;
        victoryModal.style.display = 'none';
        countdownOverlay.style.display = 'flex';
        let count = 3;
        countdownVal.textContent = count;

        resetPositions();

        countdownTimer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownVal.textContent = count;
          } else if (count === 0) {
            countdownVal.textContent = "GO!";
          } else {
            clearInterval(countdownTimer);
            countdownOverlay.style.display = 'none';
            countdownActive = false;
            isRacing = true;
            startTime = Date.now();
            gameArea.focus();
            resetIdleTimer();
            gameLoop();
          }
        }, 800);
      }

      function renderText() {
        typingDisplay.innerHTML = "";
        for (let i = 0; i < targetText.length; i++) {
          const span = document.createElement('span');
          span.className = 'char';
          if (targetText[i] === ' ') {
            span.classList.add('char-space');
            span.innerHTML = '&nbsp;';
          } else {
            span.textContent = targetText[i];
          }
          if (i === currentIndex) span.classList.add('active');
          typingDisplay.appendChild(span);
        }
      }

      function updateDashboard(wpm, accuracy) {
        accuracyVal.textContent = `${accuracy}%`;
        wpmVal.textContent = wpm;

        const clampedWPM = Math.min(120, Math.max(0, wpm));
        const wpmDeg = -120 + (clampedWPM / 120) * 240;
        wpmNeedle.style.transform = `rotate(${wpmDeg}deg)`;
        
        const wpmDash = 283 - (clampedWPM / 120) * 212;
        wpmGaugeCircle.style.strokeDashoffset = wpmDash;

        const clampedAcc = Math.min(100, Math.max(0, accuracy));
        const accDeg = -120 + (clampedAcc / 100) * 240;
        accNeedle.style.transform = `rotate(${accDeg}deg)`;
        
        const accDash = 283 - (clampedAcc / 100) * 212;
        accGaugeCircle.style.strokeDashoffset = accDash;
        accGaugeCircle.style.stroke = clampedAcc < 80 ? '#f87171' : clampedAcc < 90 ? '#facc15' : '#4ade80';
        accuracyVal.style.color = clampedAcc < 80 ? '#f87171' : clampedAcc < 90 ? '#facc15' : '#4ade80';
      }

      function resetPositions() {
        currentIndex = 0; keystrokes = 0; errors = 0; raceTicks = 0;
        playerVisualPos = START_X; ai1VisualPos = START_X; ai2VisualPos = START_X;
        bridgePos = 900; finishLinePos = -150;
        isCrossingFinish = false;

        renderText();
        playerCar.style.left = `${START_X}px`;
        ai1Car.style.left = `${START_X}px`;
        ai2Car.style.left = `${START_X}px`;
        finishLine.style.right = '-150px';

        rankVal.textContent = '1ST';
        updateDashboard(0, 100);
      }

      window.addEventListener('keydown', (e) => {
        if (!isRacing || countdownActive) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.key === "Shift" || e.key === "Control" || e.key === "Alt") return;

        resetIdleTimer();

        keystrokes++;
        const spans = typingDisplay.children;
        const expected = targetText[currentIndex];

        if (e.key === expected) {
          spans[currentIndex].className = 'char correct' + (expected === ' ' ? ' char-space' : '');
        } else {
          errors++;
          spans[currentIndex].className = 'char incorrect' + (expected === ' ' ? ' char-space' : '');
        }

        currentIndex++;

        if (currentIndex < targetText.length) {
          spans[currentIndex].classList.add('active');
        } else {
          isCrossingFinish = true;
        }

        const acc = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
        const elapsed = (Date.now() - startTime) / 60000;
        const currentWpm = elapsed > 0 ? Math.round((currentIndex / 5) / elapsed) : 0;

        updateDashboard(currentWpm, acc);
      });

      function gameLoop() {
        if (!isRacing) return;

        raceTicks++;
        
        const elapsedMinutes = (Date.now() - startTime) / 60000;
        const currentWpm = elapsedMinutes > 0 ? Math.round((currentIndex / 5) / elapsedMinutes) : 0;
        const currentAcc = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;

        let basePlacement = 1;
        if (currentAcc < 80) {
          basePlacement = 3;
        } else if (currentAcc < 90) {
          basePlacement = 2;
        }

        if (currentDifficulty === 'medium' && currentWpm < 6) {
          basePlacement = Math.min(3, basePlacement + 1);
        } else if (currentDifficulty === 'hard' && currentWpm < 12) {
          basePlacement = Math.min(3, basePlacement + 1);
        }

        let targetPlayerPos = 380;
        if (basePlacement === 3) {
          targetPlayerPos = 70;
        } else if (basePlacement === 2) {
          targetPlayerPos = 220;
        } else {
          targetPlayerPos = 380;
        }

        const bot1Oscillation = Math.sin(raceTicks * 0.08) * 60 + Math.cos(raceTicks * 0.03) * 35;
        const bot2Oscillation = Math.cos(raceTicks * 0.07) * 65 + Math.sin(raceTicks * 0.04) * 40;

        let targetAi1Pos = 240 + bot1Oscillation;
        let targetAi2Pos = 210 + bot2Oscillation;

        if (basePlacement === 1) rankVal.textContent = '1ST';
        else if (basePlacement === 2) rankVal.textContent = '2ND';
        else rankVal.textContent = '3RD';

        playerVisualPos += (targetPlayerPos - playerVisualPos) * 0.05;
        ai1VisualPos += (targetAi1Pos - ai1VisualPos) * 0.06;
        ai2VisualPos += (targetAi2Pos - ai2VisualPos) * 0.06;

        playerCar.style.left = `${Math.max(20, Math.min(650, playerVisualPos))}px`;
        ai1Car.style.left = `${Math.max(20, Math.min(650, ai1VisualPos))}px`;
        ai2Car.style.left = `${Math.max(20, Math.min(650, ai2VisualPos))}px`;

        bridgePos -= 3;
        if (bridgePos < -100) bridgePos = 1200;
        bridgeSign.style.left = `${bridgePos}px`;

        const potholes = container.querySelectorAll('.pothole, .rock');
        potholes.forEach((obs, idx) => {
          let currentLeft = parseFloat(obs.dataset.left || (idx + 1) * 300);
          currentLeft -= 3;
          if (currentLeft < -60) currentLeft = 950;
          obs.dataset.left = currentLeft;
          obs.style.left = `${currentLeft}px`;
        });

        if (isCrossingFinish) {
          finishLinePos += 12;
          finishLine.style.right = `${finishLinePos}px`;

          if (finishLinePos > (container.querySelector('.track-wrapper').clientWidth - playerVisualPos)) {
            finishRace(basePlacement);
            return;
          }
        }

        animFrame = requestAnimationFrame(gameLoop);
      }

      function finishRace(finalPlacement) {
        isRacing = false;
        cancelAnimationFrame(animFrame);
        if (idleTimer) clearTimeout(idleTimer);

        const finalAccNum = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
        const elapsedMinutes = (Date.now() - startTime) / 60000;
        const finalWpmNum = elapsedMinutes > 0 ? Math.round((currentIndex / 5) / elapsedMinutes) : 0;
        
        const winnerTitle = container.querySelector('#winnerTitle');
        const winnerSubtitle = container.querySelector('#winnerSubtitle');

        let rankString = '1ST';
        if (finalPlacement === 1) {
          rankString = '1ST';
          rankVal.textContent = '1ST';
          winnerTitle.textContent = '1st Place!';
          winnerTitle.style.color = '#facc15';
          winnerSubtitle.textContent = `Outstanding ${finalAccNum}% accuracy! You mastered the race!`;
          launchConfetti();
        } else if (finalPlacement === 2) {
          rankString = '2ND';
          rankVal.textContent = '2ND';
          winnerTitle.textContent = '2nd Place!';
          winnerTitle.style.color = '#e2e8f0';
          winnerSubtitle.textContent = `Solid driving! Reach 90%+ accuracy to claim 1st Place!`;
        } else {
          rankString = '3RD';
          rankVal.textContent = '3RD';
          winnerTitle.textContent = '3rd Place!';
          winnerTitle.style.color = '#f97316';
          winnerSubtitle.textContent = `Keep accuracy above 80% and keep your speed up!`;
        }

        winnerCarContainer.innerHTML = playerCar.outerHTML;
        const modalCar = winnerCarContainer.querySelector('.car-container');
        if (modalCar) {
          modalCar.style.left = '0'; 
          modalCar.style.top = '0';
          const modalCarLabel = modalCar.querySelector('.car-label');
          if (modalCarLabel) modalCarLabel.remove();
        }

        container.querySelector('#finalAcc').textContent = accuracyVal.textContent;
        container.querySelector('#finalWpm').textContent = wpmVal.textContent;

        sendDataToMission2(finalAccNum, finalWpmNum, rankString);

        setTimeout(() => {
          victoryModal.style.display = 'flex';
        }, 300);
      }

      renderText();
    })();
  </script>
</div>
