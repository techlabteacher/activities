<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission 2: Racecar Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --class-theme-color: #22c55e;
      --font-tech: 'Share Tech Mono', monospace;
      --font-header: 'Orbitron', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 100%);
      color: #f8fafc;
      font-family: var(--font-tech);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      user-select: none;
    }

    .game-console {
      max-width: 900px;
      width: 100%;
      background: rgba(19, 27, 46, 0.95);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 0 35px var(--class-theme-color);
      border: 3px solid var(--class-theme-color);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--class-theme-color);
      padding: 10px 18px;
      border-radius: 12px;
    }

    .btn-back {
      font-family: var(--font-tech);
      background: rgba(34, 197, 94, 0.15);
      color: #ffffff;
      border: 1px solid var(--class-theme-color);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--class-theme-color);
      color: #020617;
      box-shadow: 0 0 10px var(--class-theme-color);
    }

    .game-title {
      font-family: var(--font-header);
      color: var(--class-theme-color);
      font-size: 1.3rem;
    }

    /* Track Layout */
    .track-container {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .track-lane {
      position: relative;
      height: 60px;
      background: #1e293b;
      border-radius: 10px;
      border: 2px dashed #475569;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }

    .finish-line {
      position: absolute;
      right: 20px;
      top: 0;
      bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(
        0deg,
        #fff,
        #fff 10px,
        #000 10px,
        #000 20px
      );
      border-radius: 2px;
    }

    .car {
      position: absolute;
      left: 10px;
      font-size: 2.2rem;
      transition: left 0.2s ease-out;
      z-index: 2;
    }

    .opponent-car {
      filter: hue-rotate(140deg);
    }

    /* Target Typing Box */
    .target-display {
      background: #030712;
      border: 2px solid var(--class-theme-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 2rem;
      letter-spacing: 2px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-node { display: inline-block; padding: 0 2px; border-radius: 3px; }
    .char-done { color: #475569; }
    .char-current { background-color: var(--class-theme-color); color: #020617; font-weight: bold; }
    .char-error { background-color: #ef4444; color: white; }

    /* Telemetry */
    .telemetry {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      color: #cbd5e1;
      padding: 0 10px;
    }
  </style>
</head>
<body>

<div class="game-console">
  <div class="header-bar">
    <button class="btn-back" onclick="returnToMission()">⬅ RETURN TO MISSION</button>
    <div class="game-title">🏁 RACECAR SPEEDWAY</div>
    <div id="compBadge" style="color: var(--class-theme-color);">COMPUTER: #--</div>
  </div>

  <div class="track-container">
    <div class="finish-line"></div>
    <div class="track-lane">
      <div id="playerCar" class="car">🏎️</div>
    </div>
    <div class="track-lane">
      <div id="opponentCar" class="car opponent-car">🏎️</div>
    </div>
  </div>

  <div class="telemetry">
    <div>ACCURACY: <span id="accVal" style="color: var(--class-theme-color);">100%</span></div>
    <div>PROGRESS: <span id="progressVal">0%</span></div>
  </div>

  <div class="target-display" id="targetDisplay"></div>
</div>

<script>
  const raceText = "ssl lls a;a ad; sss lll ;;aa a;a; slsl adad ;a;a";
  let currentIndex = 0;
  let totalTyped = 0;
  let correctTyped = 0;
  let errorIndices = [];

  let opponentProgress = 0;
  let gameInterval = null;
  let gameOver = false;

  function init() {
    setupClassProfile();
    renderTargetText();
    window.addEventListener('keydown', handleKeyPress);
    startOpponent();
  }

  function setupClassProfile() {
    const urlParams = new URLSearchParams(window.location.search);
    const cls = urlParams.get('class') || sessionStorage.getItem('qwerty_class_name') || 'UNASSIGNED';
    const comp = urlParams.get('comp') || sessionStorage.getItem('qwerty_computer_num') || '--';
    
    document.getElementById('compBadge').innerText = `COMPUTER: #${comp}`;

    let activeColor = '#22c55e';
    const lowerCls = cls.toLowerCase();
    if (lowerCls.includes('blue group')) activeColor = '#38bdf8';
    else if (lowerCls.includes('red group')) activeColor = '#ec4899';
    else if (lowerCls.includes('bottita')) activeColor = '#f97316';
    else if (lowerCls.includes('raddatz')) activeColor = '#eab308';

    document.documentElement.style.setProperty('--class-theme-color', activeColor);
  }

  function renderTargetText() {
    const container = document.getElementById('targetDisplay');
    container.innerHTML = '';
    
    for (let i = 0; i < raceText.length; i++) {
      const span = document.createElement('span');
      span.className = 'char-node';
      if (raceText[i] === ' ') {
        span.innerHTML = '&nbsp;';
      } else {
        span.innerText = raceText[i];
      }

      if (i < currentIndex) {
        span.classList.add(errorIndices.includes(i) ? 'char-error' : 'char-done');
      } else if (i === currentIndex) {
        span.classList.add('char-current');
      }
      container.appendChild(span);
    }
  }

  function startOpponent() {
    // Constant pacing for opponent car
    gameInterval = setInterval(() => {
      if (gameOver) return;
      opponentProgress += 0.8;
      updateCarPositions();

      if (opponentProgress >= 100) {
        endGame();
      }
    }, 300);
  }

  function handleKeyPress(e) {
    if (gameOver) return;
    if (e.key === 'Shift') return;
    if (e.key === ' ') e.preventDefault();
    if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;

    const expectedChar = raceText[currentIndex];
    totalTyped++;

    if (e.key === expectedChar) {
      correctTyped++;
    } else {
      errorIndices.push(currentIndex);
    }

    currentIndex++;

    const accuracy = Math.round((correctTyped / totalTyped) * 100);
    document.getElementById('accVal').innerText = `${accuracy}%`;
    
    const progressPercent = Math.round((currentIndex / raceText.length) * 100);
    document.getElementById('progressVal').innerText = `${progressPercent}%`;

    updateCarPositions();
    renderTargetText();

    if (currentIndex >= raceText.length) {
      endGame();
    }
  }

  function updateCarPositions() {
    const trackWidth = document.querySelector('.track-lane').clientWidth - 60; // account for car width
    
    const playerPercent = currentIndex / raceText.length;
    const playerPos = Math.min(trackWidth, playerPercent * trackWidth);
    document.getElementById('playerCar').style.left = `${10 + playerPos}px`;

    const opponentPos = Math.min(trackWidth, (opponentProgress / 100) * trackWidth);
    document.getElementById('opponentCar').style.left = `${10 + opponentPos}px`;
  }

  function endGame() {
    gameOver = true;
    clearInterval(gameInterval);

    const finalAccuracy = totalTyped > 0 ? Math.round((correctTyped / totalTyped) * 100) : 0;
    
    sessionStorage.setItem("last_lesson_result", JSON.stringify({
      lessonId: 6,
      accuracy: finalAccuracy
    }));

    returnToMission();
  }

  function returnToMission() {
    window.location.href = "index.html";
  }

  window.onload = init;
</script>
</body>
</html>
