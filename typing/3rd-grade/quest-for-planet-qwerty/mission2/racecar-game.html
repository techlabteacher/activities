<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission 2: Racecar Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --class-theme-color: #22c55e;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --font-tech: 'Share Tech Mono', monospace;
      --font-header: 'Orbitron', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Open Sans', sans-serif;
      min-height: 100vh;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .game-console {
      max-width: 980px;
      width: 100%;
      background: rgba(19, 27, 46, 0.95);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 0 35px var(--class-theme-color);
      border: 3px solid var(--class-theme-color);
      position: relative;
    }

    .student-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--class-theme-color);
      padding: 6px 16px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-family: var(--font-header);
      font-size: 0.85rem;
      color: var(--class-theme-color);
    }

    .btn-nav {
      font-family: var(--font-tech);
      background: rgba(34, 197, 94, 0.15);
      color: #ffffff;
      border: 1px solid var(--class-theme-color);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-nav:hover {
      background: var(--class-theme-color);
      color: #020617;
      box-shadow: 0 0 10px var(--class-theme-color);
    }

    .telemetry-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: var(--font-tech);
    }

    .stat-box { text-align: center; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; display: block; }
    .stat-val { font-size: 1.4rem; font-weight: bold; color: var(--class-theme-color); }

    .track-container {
      background: #090d16;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .lane {
      position: relative;
      height: 48px;
      border-bottom: 2px dashed #1e293b;
      display: flex;
      align-items: center;
    }

    .lane:last-child { border-bottom: none; }

    .finish-line {
      position: absolute;
      right: 20px;
      top: 0;
      bottom: 0;
      width: 12px;
      background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px);
      z-index: 2;
    }

    .car-container {
      position: absolute;
      left: 0;
      transition: left 0.2s linear;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 3;
    }

    .car-sprite {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.3));
    }

    .car-label {
      font-family: var(--font-tech);
      font-size: 0.75rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .terminal-display {
      background: #030712;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 20px 15px;
      font-family: var(--font-tech);
      font-size: 1.8rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .char-node { display: inline-block; padding: 1px 2px; border-radius: 3px; min-width: 0.6em; }
    .char-node.space-node { min-width: 0.5em; }
    .char-done { color: #475569; }
    .char-current { background-color: var(--class-theme-color); color: #020617 !important; font-weight: bold; }
    .char-error { background-color: var(--neon-red) !important; color: white !important; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #0f172a;
      border: 2px solid var(--class-theme-color);
      border-radius: 20px;
      padding: 30px;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-family: var(--font-header);
      color: var(--class-theme-color);
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .btn-primary {
      font-family: var(--font-tech);
      background: var(--class-theme-color);
      color: #020617;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-primary:hover { transform: scale(1.05); }
  </style>
</head>
<body>

<div class="game-console" id="gameConsole">
  <div class="student-header-bar">
    <button class="btn-nav" onclick="returnToMission()">⬅ RETURN TO LESSONS</button>
    <span id="activeClassBadge">CLASS: UNASSIGNED</span>
    <span id="activeCompBadge">COMPUTER: #--</span>
  </div>

  <div class="telemetry-bar">
    <div class="stat-box">
      <span class="stat-label">POSITION</span>
      <span id="rankVal" class="stat-val">1ST</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">SPEED</span>
      <span id="wpmVal" class="stat-val">0 WPM</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">ACCURACY</span>
      <span id="accuracyVal" class="stat-val">100%</span>
    </div>
  </div>

  <div class="track-container">
    <div class="finish-line"></div>
    <div class="lane">
      <div id="playerCar" class="car-container">
        <span class="car-sprite">🏎️</span>
        <span class="car-label" style="color: var(--class-theme-color);">YOU</span>
      </div>
    </div>
    <div class="lane">
      <div id="botCar1" class="car-container">
        <span class="car-sprite">🏎️</span>
        <span class="car-label" style="color: #38bdf8;">BOT ALPHA</span>
      </div>
    </div>
    <div class="lane">
      <div id="botCar2" class="car-container">
        <span class="car-sprite">🏎️</span>
        <span class="car-label" style="color: #f59e0b;">BOT BETA</span>
      </div>
    </div>
  </div>

  <div class="terminal-display">
    <div id="textNodesContainer"></div>
  </div>

  <div id="victoryModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="winnerTitle" class="modal-title">VICTORY!</h2>
      <div id="winnerCarContainer" style="font-size: 2.5rem; margin: 15px 0; height: 50px; display: flex; justify-content: center; align-items: center; position: relative;"></div>
      <p id="winnerSubtitle" style="color: #cbd5e1; font-size: 1rem; margin-bottom: 10px;"></p>
      <p style="margin-bottom: 15px; color: #cbd5e1; font-size: 0.95rem;">
        WPM: <strong id="finalWpm">0</strong> | Accuracy: <strong id="finalAcc">100%</strong>
      </p>
      <button class="btn-primary" onclick="returnToMission()">Continue ➔</button>
    </div>
  </div>
</div>

<script>
  const container = document.getElementById('gameConsole');
  const textContainer = container.querySelector('#textNodesContainer');
  const victoryModal = container.querySelector('#victoryModal');
  const winnerCarContainer = container.querySelector('#winnerCarContainer');
  const rankVal = container.querySelector('#rankVal');
  const wpmVal = container.querySelector('#wpmVal');
  const accuracyVal = container.querySelector('#accuracyVal');
  const playerCar = container.querySelector('#playerCar');
  const botCar1 = container.querySelector('#botCar1');
  const botCar2 = container.querySelector('#botCar2');

  const raceText = "a s d f j k l ; sad lad fad ask dads lads fads all fall asks sasa lala";
  
  let currentIndex = 0;
  let keystrokes = 0;
  let errors = 0;
  let startTime = null;
  let isRacing = false;
  let idleTimer = null;
  let animFrame = null;

  let playerProgress = 0;
  let bot1Progress = 0;
  let bot2Progress = 0;

  const bot1Speed = 0.085;
  const bot2Speed = 0.065;

  function init() {
    loadClassProfile();
    renderText();
    window.addEventListener('keydown', handleKeyDown);
  }

  function loadClassProfile() {
    const urlParams = new URLSearchParams(window.location.search);
    const savedClass = urlParams.get('class') || sessionStorage.getItem('qwerty_class_name') || 'UNASSIGNED';
    const savedComp = urlParams.get('comp') || sessionStorage.getItem('qwerty_computer_num') || '--';

    let activeColor = '#22c55e';
    const formattedClassName = savedClass.trim().toLowerCase();

    if (formattedClassName.includes('blue group')) activeColor = '#38bdf8';
    else if (formattedClassName.includes('red group')) activeColor = '#ec4899';
    else if (formattedClassName.includes('bottita')) activeColor = '#f97316';
    else if (formattedClassName.includes('raddatz')) activeColor = '#eab308';

    document.documentElement.style.setProperty('--class-theme-color', activeColor);
    container.querySelector('#activeClassBadge').innerText = `CLASS: ${savedClass.toUpperCase()}`;
    container.querySelector('#activeCompBadge').innerText = `COMPUTER: #${savedComp}`;
  }

  function renderText() {
    textContainer.innerHTML = '';
    for (let i = 0; i < raceText.length; i++) {
      const span = document.createElement('span');
      span.className = 'char-node';
      if (raceText[i] === ' ') {
        span.classList.add('space-node');
        span.innerHTML = '&nbsp;';
      } else {
        span.innerText = raceText[i];
      }
      if (i === 0) span.classList.add('char-current');
      textContainer.appendChild(span);
    }
  }

  function handleKeyDown(e) {
    if (e.key === 'Shift' || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key === ' ') e.preventDefault();

    if (!isRacing && currentIndex < raceText.length) {
      isRacing = true;
      startTime = Date.now();
      resetIdleTimer();
      requestAnimationFrame(gameLoop);
    } else if (isRacing) {
      resetIdleTimer();
    }

    if (currentIndex >= raceText.length) return;

    keystrokes++;
    const nodes = textContainer.children;

    if (e.key === raceText[currentIndex]) {
      nodes[currentIndex].className = 'char-node char-done' + (raceText[currentIndex] === ' ' ? ' space-node' : '');
      currentIndex++;
      playerProgress = (currentIndex / raceText.length) * 100;
      
      if (currentIndex < raceText.length) {
        nodes[currentIndex].className = 'char-node char-current' + (raceText[currentIndex] === ' ' ? ' space-node' : '');
      }
    } else {
      nodes[currentIndex].className = 'char-node char-error' + (raceText[currentIndex] === ' ' ? ' space-node' : '');
      errors++;
    }

    updateTelemetry();

    if (playerProgress >= 100) {
      let placement = 1;
      if (bot1Progress >= 100 || bot2Progress >= 100) placement++;
      if (bot1Progress >= 100 && bot2Progress >= 100) placement++;
      finishRace(placement);
    }
  }

  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (isRacing) stopGameDueToInactivity();
    }, 10000);
  }

  function gameLoop() {
    if (!isRacing) return;

    if (bot1Progress < 100) bot1Progress += bot1Speed;
    if (bot2Progress < 100) bot2Progress += bot2Speed;

    updateCarPositions();
    updateRankDisplay();

    animFrame = requestAnimationFrame(gameLoop);
  }

  function updateCarPositions() {
    const trackWidth = container.querySelector('.lane').clientWidth - 60;
    playerCar.style.left = `${(playerProgress / 100) * trackWidth}px`;
    botCar1.style.left = `${(Math.min(bot1Progress, 100) / 100) * trackWidth}px`;
    botCar2.style.left = `${(Math.min(bot2Progress, 100) / 100) * trackWidth}px`;
  }

  function updateTelemetry() {
    const acc = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
    accuracyVal.textContent = `${acc}%`;

    if (startTime) {
      const elapsedMinutes = (Date.now() - startTime) / 60000;
      const wpm = elapsedMinutes > 0 ? Math.round((currentIndex / 5) / elapsedMinutes) : 0;
      wpmVal.textContent = `${wpm} WPM`;
    }
  }

  function updateRankDisplay() {
    let rank = 1;
    if (bot1Progress > playerProgress) rank++;
    if (bot2Progress > playerProgress) rank++;

    const suffix = rank === 1 ? 'ST' : (rank === 2 ? 'ND' : 'RD');
    rankVal.textContent = `${rank}${suffix}`;
  }

  function calculateStars(accuracy) {
    if (accuracy >= 95) return 5;
    if (accuracy >= 90) return 4;
    if (accuracy >= 86) return 3;
    if (accuracy >= 83) return 2;
    if (accuracy >= 80) return 1;
    return 0;
  }

  function stopGameDueToInactivity() {
    isRacing = false;
    cancelAnimationFrame(animFrame);
    if (idleTimer) clearTimeout(idleTimer);

    const winnerTitle = container.querySelector('#winnerTitle');
    const winnerSubtitle = container.querySelector('#winnerSubtitle');

    rankVal.textContent = '---';
    winnerTitle.textContent = "Time's Up!";
    winnerTitle.style.color = '#ef4444';
    winnerSubtitle.textContent = "The race stopped due to 10 seconds of inactivity.";

    winnerCarContainer.innerHTML = playerCar.outerHTML;
    const modalCar = winnerCarContainer.querySelector('.car-container');
    if (modalCar) {
      modalCar.style.left = '0'; 
      modalCar.style.top = '0';
      const modalCarLabel = modalCar.querySelector('.car-label');
      if (modalCarLabel) modalCarLabel.remove();
    }

    container.querySelector('#finalAcc').textContent = accuracyVal.textContent;
    container.querySelector('#finalWpm').textContent = wpmVal.textContent;

    victoryModal.style.display = 'flex';
  }

  function finishRace(finalPlacement) {
    isRacing = false;
    cancelAnimationFrame(animFrame);
    if (idleTimer) clearTimeout(idleTimer);

    const finalAccNum = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
    const stars = calculateStars(finalAccNum);

    const winnerTitle = container.querySelector('#winnerTitle');
    const winnerSubtitle = container.querySelector('#winnerSubtitle');

    if (finalPlacement === 1) {
      winnerTitle.textContent = '1st Place!';
      winnerTitle.style.color = '#facc15';
      winnerSubtitle.textContent = `Earned ${stars} ⭐ Star${stars === 1 ? '' : 's'} with ${finalAccNum}% accuracy!`;
      launchConfetti();
    } else if (finalPlacement === 2) {
      winnerTitle.textContent = '2nd Place!';
      winnerTitle.style.color = '#e2e8f0';
      winnerSubtitle.textContent = `Earned ${stars} ⭐ Star${stars === 1 ? '' : 's'}. Reach higher accuracy for 1st Place!`;
    } else {
      winnerTitle.textContent = '3rd Place!';
      winnerTitle.style.color = '#f97316';
      winnerSubtitle.textContent = `Earned ${stars} ⭐ Star${stars === 1 ? '' : 's'}. Keep your speed up!`;
    }

    winnerCarContainer.innerHTML = playerCar.outerHTML;
    const modalCar = winnerCarContainer.querySelector('.car-container');
    if (modalCar) {
      modalCar.style.left = '0'; 
      modalCar.style.top = '0';
      const modalCarLabel = modalCar.querySelector('.car-label');
      if (modalCarLabel) modalCarLabel.remove();
    }

    container.querySelector('#finalAcc').textContent = accuracyVal.textContent;
    container.querySelector('#finalWpm').textContent = wpmVal.textContent;

    setTimeout(() => {
      victoryModal.style.display = 'flex';
    }, 300);
  }

  function launchConfetti() {
    if (typeof confetti === 'function') {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
  }

  function returnToMission() {
    const finalAccNum = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
    
    // Save completion data so index (32).html picks it up upon returning
    sessionStorage.setItem("last_lesson_result", JSON.stringify({ lessonId: 6, accuracy: finalAccNum }));
    
    // Target destination file
    window.location.href = "index (32).html";
  }

  window.onload = init;
</script>
</body>
</html>
