<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Racecar Game</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #22c55e;
      --accent-red: #ef4444;
      --track: #334155;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .stat-box {
      background: rgba(255,255,255,0.05);
      padding: 8px 16px;
      border-radius: 8px;
    }

    .track-container {
      position: relative;
      background: var(--track);
      height: 120px;
      border-radius: 12px;
      margin: 20px 0;
      overflow: hidden;
      border: 2px dashed rgba(255,255,255,0.2);
    }

    .finish-line {
      position: absolute;
      right: 20px;
      top: 0;
      bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(
        0deg,
        #fff,
        #fff 10px,
        #000 10px,
        #000 20px
      );
    }

    .car {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      transition: left 0.2s ease-out;
    }

    .text-display {
      font-size: 1.4rem;
      line-height: 1.6;
      background: rgba(0,0,0,0.2);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      user-select: none;
      word-break: break-word;
    }

    .correct { color: #4ade80; }
    .incorrect { color: #f87171; background: rgba(239, 68, 68, 0.2); }
    .current { border-bottom: 2px solid var(--primary); }

    .input-area {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.1);
      border: 2px solid transparent;
      border-radius: 8px;
      color: white;
      box-sizing: border-box;
      outline: none;
    }

    .input-area:focus {
      border-color: var(--primary);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <h2>🏎️ Typing Racecar Game</h2>
      <div class="stats">
        <div class="stat-box">WPM: <span id="wpm">0</span></div>
        <div class="stat-box">Accuracy: <span id="accuracy">100</span>%</div>
      </div>
    </div>

    <div class="track-container">
      <div class="finish-line"></div>
      <div class="car" id="car">🏎️</div>
    </div>

    <div class="text-display" id="textDisplay"></div>

    <input type="text" class="input-area" id="inputArea" placeholder="Start typing here..." autocomplete="off" autofocus>
  </div>

  <div class="modal-overlay" id="victoryModal">
    <div class="modal">
      <h2>🏆 Race Finished!</h2>
      <p id="modalStats">WPM: 0 | Accuracy: 100%</p>
      <p id="modalStars">Stars Earned: ⭐⭐⭐⭐⭐</p>
      <button class="btn" onclick="returnToMission()">Return to Mission Lessons</button>
    </div>
  </div>

  <script>
    const sampleText = "The quick brown fox jumps over the lazy dog to win the high speed race across the finish line.";
    const textDisplay = document.getElementById('textDisplay');
    const inputArea = document.getElementById('inputArea');
    const car = document.getElementById('car');
    const wpmDisplay = document.getElementById('wpm');
    const accuracyDisplay = document.getElementById('accuracy');
    const victoryModal = document.getElementById('victoryModal');
    const modalStats = document.getElementById('modalStats');
    const modalStars = document.getElementById('modalStars');

    let startTime = null;
    let totalErrors = 0;
    let gameEnded = false;
    let finalAccuracy = 100;
    let finalWPM = 0;
    let finalStars = 0;

    function initGame() {
      textDisplay.innerHTML = sampleText.split('').map((char, index) => {
        return `<span class="${index === 0 ? 'current' : ''}">${char}</span>`;
      }).join('');
    }

    inputArea.addEventListener('input', () => {
      if (gameEnded) return;

      const characters = textDisplay.querySelectorAll('span');
      const typed = inputArea.value.split('');

      if (!startTime && typed.length > 0) {
        startTime = new Date();
      }

      let errors = 0;
      let correctChars = 0;

      characters.forEach((charSpan, index) => {
        const typedChar = typed[index];

        if (typedChar == null) {
          charSpan.className = index === typed.length ? 'current' : '';
        } else if (typedChar === charSpan.innerText) {
          charSpan.className = 'correct';
          correctChars++;
        } else {
          charSpan.className = 'incorrect';
          errors++;
        }
      });

      // Update Car Position
      const progress = (typed.length / sampleText.length) * 85; 
      car.style.left = `calc(${Math.min(progress, 85)}% + 10px)`;

      // Calculate Stats
      if (startTime) {
        const timeElapsed = (new Date() - startTime) / 1000 / 60; // minutes
        const words = typed.length / 5;
        const wpm = Math.round(words / timeElapsed) || 0;
        const accuracy = Math.max(0, Math.round(((typed.length - errors) / (typed.length || 1)) * 100));

        wpmDisplay.innerText = wpm;
        accuracyDisplay.innerText = accuracy;
        
        finalWPM = wpm;
        finalAccuracy = accuracy;
      }

      // Check Completion
      if (typed.length >= sampleText.length && errors === 0) {
        endGame();
      }
    });

    function calculateStars(acc) {
      if (acc >= 95) return 5;
      if (acc >= 90) return 4;
      if (acc >= 86) return 3;
      if (acc >= 83) return 2;
      if (acc >= 80) return 1;
      return 0;
    }

    function endGame() {
      gameEnded = true;
      inputArea.disabled = true;

      finalStars = calculateStars(finalAccuracy);

      // 1. Post message to parent frame (if running inside an iframe)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'RACE_GAME_COMPLETE',
          accuracy: finalAccuracy,
          stars: finalStars,
          wpm: finalWPM
        }, '*');
      }

      // 2. Set result in sessionStorage (for redirection)
      sessionStorage.setItem("last_lesson_result", JSON.stringify({
        lessonId: 6,
        accuracy: finalAccuracy,
        stars: finalStars,
        wpm: finalWPM
      }));

      // Display Modal
      modalStats.innerText = `WPM: ${finalWPM} | Accuracy: ${finalAccuracy}%`;
      modalStars.innerText = `Stars Earned: ${'⭐'.repeat(finalStars)}`;
      victoryModal.style.display = 'flex';
    }

    function returnToMission() {
      if (window.parent && window.parent !== window) {
        // If framed, close or signal parent
        window.parent.postMessage({ type: 'CLOSE_RACECAR_GAME' }, '*');
      } else {
        // Redirect back to Mission 2
        window.location.href = "index.html";
      }
    }

    initGame();
  </script>
</body>
</html>
