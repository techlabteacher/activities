<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 6: Racecar Speedway</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #0f172a;
      border-bottom: 2px solid #22c55e;
    }
    .btn-back {
      background: #1e293b;
      color: #22c55e;
      border: 1px solid #22c55e;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:hover { background: #22c55e; color: #020617; }
    canvas {
      flex: 1;
      width: 100%;
      display: block;
    }
    .text-display {
      height: 120px;
      background: #090d16;
      border-top: 2px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      padding: 0 20px;
    }
    .char-node { display: inline-block; padding: 2px 4px; border-radius: 4px; }
    .char-done { color: #475569; }
    .char-current { background: #22c55e; color: #020617; font-weight: bold; }
    .char-error { background: #ef4444; color: #ffffff; }
  </style>
</head>
<body>

  <div class="header-bar">
    <button class="btn-back" onclick="returnToConsole()">⬅ Exit to Console</button>
    <h1 style="font-family: 'Orbitron', sans-serif; color: #22c55e;">LESSON 6: RACECAR SPEEDWAY</h1>
    <div id="accuracyDisplay" style="font-size: 1.2rem;">Accuracy: 100%</div>
  </div>

  <canvas id="raceCanvas"></canvas>

  <div class="text-display" id="textContainer"></div>

  <script>
    const targetText = "Dad ads all fall Lass ask; sad jaff kad; jas salad";
    let currentIndex = 0;
    let keystrokes = 0;
    let errors = 0;
    let errorIndices = [];

    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');
    let carPos = 0;

    function init() {
      window.addEventListener('keydown', handleInput);
      renderText();
      requestAnimationFrame(draw);
    }

    function returnToConsole() {
      window.location.href = "mission2.html";
    }

    function handleInput(e) {
      if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;
      if (currentIndex >= targetText.length) return;

      keystrokes++;
      if (e.key === targetText[currentIndex]) {
        currentIndex++;
      } else {
        errors++;
        errorIndices.push(currentIndex);
        currentIndex++;
      }

      const acc = Math.round(((keystrokes - errors) / keystrokes) * 100);
      document.getElementById('accuracyDisplay').innerText = `Accuracy: ${acc}%`;
      renderText();

      if (currentIndex >= targetText.length) {
        setTimeout(() => {
          alert(`Lesson 6 Complete! Final Accuracy: ${acc}%`);
          returnToConsole();
        }, 300);
      }
    }

    function renderText() {
      const container = document.getElementById('textContainer');
      container.innerHTML = '';
      for (let i = 0; i < targetText.length; i++) {
        const span = document.createElement('span');
        span.className = 'char-node';
        span.innerText = targetText[i] === ' ' ? '\u00A0' : targetText[i];

        if (i < currentIndex) {
          span.classList.add(errorIndices.includes(i) ? 'char-error' : 'char-done');
        } else if (i === currentIndex) {
          span.classList.add('char-current');
        }
        container.appendChild(span);
      }
    }

    function draw() {
      canvas.width = window.innerWidth;
      canvas.height = canvas.clientHeight;

      const w = canvas.width;
      const h = canvas.height;

      // Background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      // Track
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, h * 0.3, w, h * 0.4);

      // Dashed lane lines
      ctx.strokeStyle = '#f59e0b';
      ctx.setLineDash([20, 20]);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.5);
      ctx.lineTo(w, h * 0.5);
      ctx.stroke();

      // Smooth car position updates
      const progress = currentIndex / targetText.length;
      const targetX = 50 + progress * (w - 150);
      carPos += (targetX - carPos) * 0.1;

      // Draw Car
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(carPos, h * 0.42, 80, 32);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(carPos + 45, h * 0.44, 20, 18);

      requestAnimationFrame(draw);
    }

    init();
  </script>
</body>
</html>
