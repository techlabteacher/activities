<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission 2 - Lesson 6: Speedway Type Racer</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      margin: 0;
      padding: 20px;
      background-color: #020617;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #weebly-typing-game {
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
    }

    #weebly-typing-game .game-card {
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
      box-shadow: 0 25px 40px rgba(0,0,0,0.8);
      outline: none;
    }

    #weebly-typing-game .game-header {
      background: #090d16;
      padding: 12px 22px;
      text-align: center;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #weebly-typing-game .game-title {
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    #weebly-typing-game .control-panel {
      padding: 14px 22px;
      background: #1e293b;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #334155;
    }

    #weebly-typing-game .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #weebly-typing-game label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 4px;
    }

    #weebly-typing-game .btn-level {
      border: 2px solid transparent;
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.65;
    }

    #weebly-typing-game .btn-level:hover { opacity: 0.9; transform: translateY(-2px); }
    #weebly-typing-game .btn-level.active { opacity: 1; box-shadow: 0 0 12px currentColor; transform: scale(1.05); }

    #weebly-typing-game .btn-easy { background: linear-gradient(135deg, #10b981, #047857); color: #a7f3d0; border-color: #34d399; }
    #weebly-typing-game .btn-medium { background: linear-gradient(135deg, #f59e0b, #b45309); color: #fde68a; border-color: #fbbf24; }
    #weebly-typing-game .btn-hard { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fca5a5; border-color: #f87171; }

    #weebly-typing-game .btn-action {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: all 0.2s ease;
    }

    #weebly-typing-game .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5); }
    #weebly-typing-game .btn-restart { background: linear-gradient(135deg, #0ea5e9, #0369a1); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }

    .track-wrapper { position: relative; height: 340px; background: #0f172a; overflow: hidden; }
    .speedway { position: absolute; width: 100%; height: 100%; background: #18181b; border-top: 6px solid #f59e0b; border-bottom: 6px solid #f59e0b; }
    .lane { position: relative; height: 33.33%; border-bottom: 2px dashed rgba(255,255,255,0.25); }
    .lane:last-child { border-bottom: none; }

    .bridge-sign {
      position: absolute; top: 0; bottom: 0; width: 40px; left: 120%;
      background: linear-gradient(90deg, #334155, #0f172a, #334155);
      border-left: 3px solid #fbbf24; border-right: 3px solid #fbbf24;
      box-shadow: -10px 0 20px rgba(0,0,0,0.8), 10px 0 20px rgba(0,0,0,0.8);
      z-index: 20; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .bridge-text { writing-mode: vertical-rl; color: #fbbf24; font-weight: 900; font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase; }

    .finish-line {
      position: absolute; right: -100px; top: 0; bottom: 0; width: 32px;
      background: repeating-linear-gradient(0deg, #fff, #fff 16px, #000 16px, #000 32px);
      box-shadow: 0 0 20px rgba(255,255,255,0.8); z-index: 10;
    }

    .pothole { position: absolute; width: 45px; height: 24px; background: #090d16; border-radius: 50%; border: 2px solid #27272a; pointer-events: none; }
    .rock { position: absolute; width: 20px; height: 16px; background: #52525b; border-radius: 4px; box-shadow: 2px 2px 0px #000; pointer-events: none; }

    .car-container { position: absolute; left: 300px; top: 12px; width: 140px; height: 75px; will-change: left; z-index: 15; }
    .car-label {
      position: absolute; top: -16px; left: 10px; background: rgba(0,0,0,0.85); color: #fff;
      padding: 1px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; border: 1px solid #334155; z-index: 25; text-transform: uppercase;
    }

    .typing-display {
      background: #030712; padding: 18px 20px; text-align: center;
      font-family: 'Consolas', 'Courier New', monospace; font-size: 1.8rem; font-weight: 800; white-space: normal;
      word-break: break-word; user-select: none; min-height: 85px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      border-top: 3px solid #1e293b; border-bottom: 3px solid #1e293b; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); line-height: 1.4;
      transition: border-color 0.3s ease; letter-spacing: -0.5px;
    }

    .char { color: #475569; padding: 1px 2px; border-radius: 3px; transition: all 0.15s ease; display: inline-block; margin: 0; border: 1px solid transparent; }
    .char-space { width: 12px; }
    .char.correct { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.6); }
    .char.incorrect { color: #ffffff; background: #dc2626; border: 1px solid #ef4444; border-radius: 3px; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6); }
    .char.active { color: #facc15; background: rgba(250, 204, 21, 0.2); border-bottom: 2px solid #facc15; transform: scale(1.08); }

    .dashboard-panel {
      background: linear-gradient(180deg, #090d16 0%, #020617 100%); padding: 20px; border-top: 2px solid #334155;
      display: flex; justify-content: space-around; align-items: center; box-shadow: inset 0 10px 20px rgba(0,0,0,0.9);
    }
    .gauge-cluster { display: flex; align-items: center; gap: 30px; width: 100%; max-width: 780px; justify-content: space-around; }
    .gauge { position: relative; width: 130px; height: 130px; background: radial-gradient(circle, #1e293b 0%, #090d16 70%); border-radius: 50%; border: 4px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .gauge-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge-bg { fill: none; stroke: #1e293b; stroke-width: 8; }
    .gauge-value { fill: none; stroke: #38bdf8; stroke-width: 8; stroke-dasharray: 283; stroke-dashoffset: 283; stroke-linecap: round; transition: stroke-dashoffset 0.3s ease; }
    .gauge-needle { position: absolute; width: 2px; height: 48px; background: #f43f5e; bottom: 50%; left: calc(50% - 1px); transform-origin: bottom center; transform: rotate(-120deg); transition: transform 0.3s ease-out; z-index: 5; }
    .gauge-cap { position: absolute; width: 14px; height: 14px; background: #f8fafc; border-radius: 50%; border: 3px solid #0f172a; z-index: 6; }
    .gauge-title { position: absolute; bottom: 18px; font-size: 0.65rem; font-weight: 900; color: #64748b; letter-spacing: 1px; text-transform: uppercase; }
    .gauge-readout { position: absolute; top: 25px; font-size: 1.1rem; font-weight: 800; color: #38bdf8; font-family: 'Consolas', monospace; }

    .digital-hud { background: #000; border: 2px solid #334155; border-radius: 14px; padding: 12px 24px; text-align: center; min-width: 180px; }
    .digital-rank { font-size: 1.8rem; font-weight: 900; color: #facc15; margin-bottom: 2px; }
    .digital-lbl { font-size: 0.65rem; color: #64748b; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

    .modal-overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.92); display: flex; justify-content: center; align-items: center; z-index: 50; }
    .modal { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 580px; text-align: center; border: 1px solid #475569; position: relative; }

    .star-rating { font-size: 2.5rem; color: #facc15; margin: 10px 0; }
    .return-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: white; border: none; padding: 14px 28px; border-radius: 12px;
      font-size: 1.1rem; font-weight: 800; cursor: pointer; text-transform: uppercase;
      letter-spacing: 1px; margin-top: 15px; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      transition: all 0.2s ease;
    }
    .return-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6); }

    .countdown-overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.75); display: none; justify-content: center; align-items: center; z-index: 40; }
    .countdown-number { font-size: 6rem; font-weight: 900; color: #38bdf8; text-shadow: 0 0 30px rgba(56, 189, 248, 0.8); animation: popIn 0.8s ease infinite; }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    .car-options { display: flex; gap: 14px; justify-content: center; margin: 20px 0; }
    .car-card { flex: 1; background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; }
    .car-card.selected { border-color: #38bdf8; background: #1e293b; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

    #confettiCanvas { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
    .trophy-icon { width: 64px; height: 64px; margin: 0 auto 10px auto; display: block; }
  </style>
</head>
<body>

  <div id="weebly-typing-game">
    <canvas id="confettiCanvas"></canvas>

    <div class="game-card" id="gameArea" tabindex="0">
      <div class="game-header">
        <h1 class="game-title">🏎️ Speedway Type Racer (Mission 2 - Lesson 6) 🏎️</h1>
        <button class="btn-action" id="exitConsoleBtn">Exit to Mission Console</button>
      </div>

      <div class="control-panel">
        <div class="control-group">
          <label>Level:</label>
          <button class="btn-level btn-easy active" data-difficulty="easy">Easy</button>
          <button class="btn-level btn-medium" data-difficulty="medium">Medium</button>
          <button class="btn-level btn-hard" data-difficulty="hard">Hard</button>
        </div>

        <div class="control-group">
          <button class="btn-action btn-restart" id="restartBtn">Restart Race</button>
          <button class="btn-action" id="openGarageBtn">Change Car</button>
        </div>
      </div>

      <div class="track-wrapper">
        <div class="speedway" id="speedway">
          <div class="finish-line" id="finishLine"></div>

          <div class="bridge-sign" id="bridgeSign">
            <div class="bridge-text">SPEEDWAY</div>
          </div>
          
          <div class="pothole" style="top: 30px; left: 400px;"></div>
          <div class="rock" style="top: 150px; left: 700px;"></div>
          <div class="pothole" style="top: 250px; left: 200px;"></div>

          <div class="lane" id="lane1">
            <div class="car-container" id="ai1Car">
              <div class="car-label">Phantom</div>
              <svg viewBox="0 0 140 70" width="100%" height="100%">
                <path d="M 12 18 L 8 12 L 20 12 L 18 18 Z" fill="#020617"/>
                <path d="M 12 52 L 8 58 L 20 58 L 18 52 Z" fill="#020617"/>
                <rect x="5" y="10" width="8" height="50" rx="3" fill="#020617"/>
                <path d="M 15 22 C 15 14, 30 10, 55 10 L 95 12 C 120 14, 134 22, 138 35 C 134 48, 120 56, 95 58 L 55 60 C 30 60, 15 56, 15 48 Z" fill="#7e22ce"/>
                <path d="M 22 31 L 128 31 L 128 39 L 22 39 Z" fill="#f3e8ff"/>
                <path d="M 58 18 C 72 18, 92 20, 98 35 C 92 50, 72 52, 58 52 Z" fill="#090d16"/>
                <path d="M 62 21 C 72 21, 88 23, 92 35 C 88 47, 72 49, 62 49 Z" fill="#c084fc" opacity="0.75"/>
              </svg>
            </div>
          </div>

          <div class="lane" id="lane2">
            <div class="car-container" id="ai2Car">
              <div class="car-label">Blaze</div>
              <svg viewBox="0 0 140 70" width="100%" height="100%">
                <path d="M 12 18 L 8 12 L 20 12 L 18 18 Z" fill="#020617"/>
                <path d="M 12 52 L 8 58 L 20 58 L 18 52 Z" fill="#020617"/>
                <rect x="5" y="10" width="8" height="50" rx="3" fill="#020617"/>
                <path d="M 15 22 C 15 14, 30 10, 55 10 L 95 12 C 120 14, 134 22, 138 35 C 134 48, 120 56, 95 58 L 55 60 C 30 60, 15 56, 15 48 Z" fill="#ea580c"/>
                <path d="M 22 31 L 128 31 L 128 39 L 22 39 Z" fill="#ffedd5"/>
                <path d="M 58 18 C 72 18, 92 20, 98 35 C 92 50, 72 52, 58 52 Z" fill="#090d16"/>
                <path d="M 62 21 C 72 21, 88 23, 92 35 C 88 47, 72 49, 62 49 Z" fill="#fb923c" opacity="0.75"/>
              </svg>
            </div>
          </div>

          <div class="lane" id="lane3">
            <div class="car-container" id="playerCar">
              <div class="car-label" id="playerCarLabel">Flare</div>
              <svg viewBox="0 0 140 70" width="100%" height="100%">
                <path d="M 12 18 L 8 12 L 20 12 L 18 18 Z" fill="#020617"/>
                <path d="M 12 52 L 8 58 L 20 58 L 18 52 Z" fill="#020617"/>
                <rect x="5" y="10" width="8" height="50" rx="3" fill="#020617"/>
                <path d="M 15 22 C 15 14, 30 10, 55 10 L 95 12 C 120 14, 134 22, 138 35 C 134 48, 120 56, 95 58 L 55 60 C 30 60, 15 56, 15 48 Z" fill="#dc2626" id="playerBodyMain"/>
                <path d="M 22 31 L 128 31 L 128 39 L 22 39 Z" fill="#ffffff" id="playerStripe"/>
                <path d="M 58 18 C 72 18, 92 20, 98 35 C 92 50, 72 52, 58 52 Z" fill="#090d16"/>
                <path d="M 62 21 C 72 21, 88 23, 92 35 C 88 47, 72 49, 62 49 Z" fill="#38bdf8" opacity="0.75"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="countdown-overlay" id="countdownOverlay">
          <div class="countdown-number" id="countdownVal">3</div>
        </div>
      </div>

      <div class="typing-display" id="typingDisplay"></div>

      <div class="dashboard-panel">
        <div class="gauge-cluster">
          <div class="gauge">
            <svg class="gauge-svg" viewBox="0 0 100 100">
              <circle class="gauge-bg" cx="50" cy="50" r="45"></circle>
              <circle class="gauge-value" id="accGaugeCircle" cx="50" cy="50" r="45" style="stroke: #4ade80;"></circle>
            </svg>
            <div class="gauge-needle" id="accNeedle"></div>
            <div class="gauge-cap"></div>
            <div class="gauge-readout" id="accuracyVal" style="color: #4ade80;">100%</div>
            <div class="gauge-title">ACCURACY</div>
          </div>

          <div class="digital-hud">
            <div class="digital-rank" id="rankVal">1ST</div>
            <div class="digital-lbl">RACE POSITION</div>
          </div>

          <div class="gauge">
            <svg class="gauge-svg" viewBox="0 0 100 100">
              <circle class="gauge-bg" cx="50" cy="50" r="45"></circle>
              <circle class="gauge-value" id="wpmGaugeCircle" cx="50" cy="50" r="45"></circle>
            </svg>
            <div class="gauge-needle" id="wpmNeedle"></div>
            <div class="gauge-cap"></div>
            <div class="gauge-readout" id="wpmVal">0</div>
            <div class="gauge-title">SPEED (WPM)</div>
          </div>
        </div>
      </div>

      <!-- Garage Modal -->
      <div class="modal-overlay" id="carModal">
        <div class="modal">
          <h2 style="color:#fff; font-size:1.8rem; margin-bottom: 5px;">Choose Your Car</h2>
          <p style="color:#94a3b8; font-size:0.85rem;">Select your racing supercar!</p>
          <div class="car-options">
            <div class="car-card selected" data-racename="Flare" data-main="#dc2626" data-stripe="#ffffff">
              <strong style="font-size:0.8rem; color:#fff;">Red Flare</strong>
            </div>
            <div class="car-card" data-racename="Volt" data-main="#0284c7" data-stripe="#f0f9ff">
              <strong style="font-size:0.8rem; color:#fff;">Blue Volt</strong>
            </div>
            <div class="car-card" data-racename="Nitro" data-main="#ca8a04" data-stripe="#fef08a">
              <strong style="font-size:0.8rem; color:#fff;">Gold Nitro</strong>
            </div>
          </div>
          <button class="btn-action" id="startRaceBtn" style="width:100%; font-size:1.1rem; padding:12px;">Start Race</button>
        </div>
      </div>

      <!-- Finish Modal -->
      <div class="modal-overlay" id="victoryModal" style="display: none;">
        <div class="modal">
          <div id="modalIconContainer">
            <svg class="trophy-icon" id="trophyIcon" viewBox="0 0 24 24" fill="none">
              <path d="M5 3H19V5C19 7.76142 16.7614 10 14 10H10C7.23858 10 5 7.76142 5 5V3Z" fill="#FACC15" stroke="#EAB308" stroke-width="1.5"/>
              <path d="M12 10V17M8 21H16M8 17H16" stroke="#EAB308" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>

          <h1 id="winnerTitle" style="color:#facc15; font-size:2rem; margin-bottom: 5px;">1st Place!</h1>
          <p id="winnerSubtitle" style="color:#f8fafc; font-size:1rem; margin-bottom: 10px;">You crossed the finish line!</p>

          <div class="star-rating" id="starDisplay">⭐⭐⭐</div>

          <div style="background:#0f172a; padding:15px; border-radius:12px; display:flex; justify-content:space-around; margin:15px 0; border:1px solid #334155;">
            <div><div id="finalAcc" style="font-size:1.5rem; font-weight:bold; color:#4ade80;">100%</div><div style="font-size:0.75rem; color:#94a3b8;">ACCURACY</div></div>
            <div><div id="finalWpm" style="font-size:1.5rem; font-weight:bold; color:#38bdf8;">0</div><div style="font-size:0.75rem; color:#94a3b8;">WPM</div></div>
          </div>

          <button class="return-btn" id="returnMissionHubBtn">Return to Mission Console</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const targetText = "Dad ads all fall Lass ask; sad jaff kad; jas salad";
      const MISSION_NUM = 2; 
      const LESSON_INDEX = 5; 

      let currentIndex = 0;
      let keystrokes = 0;
      let errors = 0;
      let startTime = null;
      let isRacing = false;
      let countdownActive = false;
      let countdownTimer = null;
      let currentDifficulty = "easy";
      
      const START_X = 300;
      let playerVisualPos = START_X;
      let ai1VisualPos = START_X;
      let ai2VisualPos = START_X;

      let raceTicks = 0;
      let finishLinePos = -150;
      let isCrossingFinish = false;
      let animFrame = null;

      const container = document.getElementById('weebly-typing-game');
      const gameArea = container.querySelector('#gameArea');
      const typingDisplay = container.querySelector('#typingDisplay');
      const carModal = container.querySelector('#carModal');
      const victoryModal = container.querySelector('#victoryModal');
      const countdownOverlay = container.querySelector('#countdownOverlay');
      const countdownVal = container.querySelector('#countdownVal');
      const playerCar = container.querySelector('#playerCar');
      const ai1Car = container.querySelector('#ai1Car');
      const ai2Car = container.querySelector('#ai2Car');
      const finishLine = container.querySelector('#finishLine');
      const accuracyVal = container.querySelector('#accuracyVal');
      const wpmVal = container.querySelector('#wpmVal');
      const rankVal = container.querySelector('#rankVal');

      const wpmNeedle = container.querySelector('#wpmNeedle');
      const accNeedle = container.querySelector('#accNeedle');
      const wpmGaugeCircle = container.querySelector('#wpmGaugeCircle');
      const accGaugeCircle = container.querySelector('#accGaugeCircle');

      function getStorageKey(missionNum, field) {
        const className = sessionStorage.getItem('qwerty_class_name') || 'DefaultClass';
        const compNum = sessionStorage.getItem('qwerty_computer_num') || '0';
        const safeClass = className.replace(/\s+/g, '_');
        return `qwerty_${safeClass}_comp${compNum}_mission${missionNum}_${field}`;
      }

      function saveLessonProgress(starsEarned) {
        const storageKey = getStorageKey(MISSION_NUM, 'lesson_stars');
        let starsArray = [0, 0, 0, 0, 0, 0];
        const existingData = localStorage.getItem(storageKey);
        if (existingData) {
          try { starsArray = JSON.parse(existingData); } catch(e) {}
        }
        starsArray[LESSON_INDEX] = Math.max(starsArray[LESSON_INDEX] || 0, starsEarned);
        localStorage.setItem(storageKey, JSON.stringify(starsArray));
      }

      function goToMissionConsole() {
        window.location.href = 'index.html';
      }

      document.getElementById('exitConsoleBtn').addEventListener('click', goToMissionConsole);
      document.getElementById('returnMissionHubBtn').addEventListener('click', goToMissionConsole);

      function setDifficulty(diff) {
        currentDifficulty = diff;
        container.querySelectorAll('.control-panel .btn-level').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-difficulty') === diff);
        });
      }

      container.querySelectorAll('.control-panel .btn-level').forEach(btn => {
        btn.addEventListener('click', () => {
          setDifficulty(btn.getAttribute('data-difficulty'));
          startCountdown();
        });
      });

      container.querySelector('#openGarageBtn').addEventListener('click', () => {
        isRacing = false;
        cancelAnimationFrame(animFrame);
        carModal.style.display = 'flex';
      });

      container.querySelector('#restartBtn').addEventListener('click', () => startCountdown());
      container.querySelector('#startRaceBtn').addEventListener('click', () => {
        carModal.style.display = 'none';
        startCountdown();
      });

      function startCountdown() {
        isRacing = false;
        cancelAnimationFrame(animFrame);
        countdownActive = true;
        victoryModal.style.display = 'none';
        countdownOverlay.style.display = 'flex';
        let count = 3;
        countdownVal.textContent = count;

        resetPositions();

        countdownTimer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownVal.textContent = count;
          } else if (count === 0) {
            countdownVal.textContent = "GO!";
          } else {
            clearInterval(countdownTimer);
            countdownOverlay.style.display = 'none';
            countdownActive = false;
            isRacing = true;
            startTime = Date.now();
            gameArea.focus();
            gameLoop();
          }
        }, 800);
      }

      function renderText() {
        typingDisplay.innerHTML = "";
        for (let i = 0; i < targetText.length; i++) {
          const span = document.createElement('span');
          span.className = 'char';
          if (targetText[i] === ' ') {
            span.classList.add('char-space');
            span.innerHTML = '&nbsp;';
          } else {
            span.textContent = targetText[i];
          }
          if (i === currentIndex) span.classList.add('active');
          typingDisplay.appendChild(span);
        }
      }

      function updateDashboard(wpm, accuracy) {
        accuracyVal.textContent = `${accuracy}%`;
        wpmVal.textContent = wpm;

        const clampedWPM = Math.min(120, Math.max(0, wpm));
        wpmNeedle.style.transform = `rotate(${-120 + (clampedWPM / 120) * 240}deg)`;
        wpmGaugeCircle.style.strokeDashoffset = 283 - (clampedWPM / 120) * 212;

        const clampedAcc = Math.min(100, Math.max(0, accuracy));
        accNeedle.style.transform = `rotate(${-120 + (clampedAcc / 100) * 240}deg)`;
        accGaugeCircle.style.strokeDashoffset = 283 - (clampedAcc / 100) * 212;
      }

      function resetPositions() {
        currentIndex = 0; keystrokes = 0; errors = 0; raceTicks = 0;
        playerVisualPos = START_X; ai1VisualPos = START_X; ai2VisualPos = START_X;
        finishLinePos = -150;
        isCrossingFinish = false;

        renderText();
        playerCar.style.left = `${START_X}px`;
        ai1Car.style.left = `${START_X}px`;
        ai2Car.style.left = `${START_X}px`;
        finishLine.style.right = '-150px';

        rankVal.textContent = '1ST';
        updateDashboard(0, 100);
      }

      window.addEventListener('keydown', (e) => {
        if (!isRacing || countdownActive) return;
        if (e.key === "Shift" || e.key === "Control" || e.key === "Alt") return;

        keystrokes++;
        const spans = typingDisplay.children;
        const expected = targetText[currentIndex];

        if (e.key === expected) {
          spans[currentIndex].className = 'char correct' + (expected === ' ' ? ' char-space' : '');
        } else {
          errors++;
          spans[currentIndex].className = 'char incorrect' + (expected === ' ' ? ' char-space' : '');
        }

        currentIndex++;

        if (currentIndex < targetText.length) {
          spans[currentIndex].classList.add('active');
        } else {
          isCrossingFinish = true;
        }

        const acc = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;
        const elapsed = (Date.now() - startTime) / 60000;
        const currentWpm = elapsed > 0 ? Math.round((currentIndex / 5) / elapsed) : 0;

        updateDashboard(currentWpm, acc);
      });

      function gameLoop() {
        if (!isRacing) return;
        raceTicks++;

        const elapsedMinutes = (Date.now() - startTime) / 60000;
        const currentWpm = elapsedMinutes > 0 ? Math.round((currentIndex / 5) / elapsedMinutes) : 0;
        const currentAcc = keystrokes > 0 ? Math.max(0, Math.round(((keystrokes - errors) / keystrokes) * 100)) : 100;

        let basePlacement = 1;
        if (currentAcc < 80) basePlacement = 3;
        else if (currentAcc < 90) basePlacement = 2;

        let targetPlayerPos = basePlacement === 3 ? 70 : basePlacement === 2 ? 220 : 380;
        const bot1Oscillation = Math.sin(raceTicks * 0.08) * 60;
        const bot2Oscillation = Math.cos(raceTicks * 0.07) * 65;

        playerVisualPos += (targetPlayerPos - playerVisualPos) * 0.05;
        ai1VisualPos += ((240 + bot1Oscillation) - ai1VisualPos) * 0.06;
        ai2VisualPos += ((210 + bot2Oscillation) - ai2VisualPos) * 0.06;

        playerCar.style.left = `${Math.max(20, Math.min(650, playerVisualPos))}px`;
        ai1Car.style.left = `${Math.max(20, Math.min(650, ai1VisualPos))}px`;
        ai2Car.style.left = `${Math.max(20, Math.min(650, ai2VisualPos))}px`;

        if (isCrossingFinish) {
          finishLinePos += 12;
          finishLine.style.right = `${finishLinePos}px`;

          if (finishLinePos > (container.querySelector('.track-wrapper').clientWidth - playerVisualPos)) {
            finishRace(basePlacement);
            return;
          }
        }

        animFrame = requestAnimationFrame(gameLoop);
      }

      function finishRace(finalPlacement) {
        isRacing = false;
        cancelAnimationFrame(animFrame);

        let starsEarned = finalPlacement === 1 ? 3 : finalPlacement === 2 ? 2 : 1;
        saveLessonProgress(starsEarned);

        const winnerTitle = container.querySelector('#winnerTitle');
        const starDisplay = container.querySelector('#starDisplay');

        if (finalPlacement === 1) {
          winnerTitle.textContent = '1st Place!';
          starDisplay.textContent = '⭐⭐⭐';
        } else if (finalPlacement === 2) {
          winnerTitle.textContent = '2nd Place!';
          starDisplay.textContent = '⭐⭐';
        } else {
          winnerTitle.textContent = '3rd Place!';
          starDisplay.textContent = '⭐';
        }

        container.querySelector('#finalAcc').textContent = accuracyVal.textContent;
        container.querySelector('#finalWpm').textContent = wpmVal.textContent;

        victoryModal.style.display = 'flex';
      }

      renderText();
    })();
  </script>
</body>
</html>
