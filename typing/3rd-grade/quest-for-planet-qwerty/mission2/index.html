<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Mission 2: Home Row Mastery</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-bar {
      background: #0f172a;
      border-bottom: 2px solid #38bdf8;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      color: #38bdf8;
    }
    .lesson-nav {
      display: flex;
      gap: 10px;
      background: #090d16;
      padding: 15px 30px;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
    }
    .btn-lesson {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-lesson:hover { background: #334155; color: #f8fafc; }
    .btn-lesson.active { background: #38bdf8; color: #020617; border-color: #38bdf8; }
    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .text-display {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 30px;
      max-width: 900px;
      width: 100%;
      font-size: 2rem;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .char-node { display: inline-block; padding: 2px 4px; border-radius: 4px; }
    .char-done { color: #475569; }
    .char-current { background: #38bdf8; color: #020617; font-weight: bold; }
    .char-error { background: #ef4444; color: #ffffff; }
    .keyboard {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1e293b;
    }
    .key-row { display: flex; justify-content: center; gap: 6px; }
    .key {
      width: 45px;
      height: 45px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #64748b;
    }
    .key.active-target { background: #38bdf8; color: #020617; box-shadow: 0 0 12px #38bdf8; }
    .key.space { width: 250px; }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .modal-btn {
      margin-top: 20px;
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 10px 20px;
      font-family: inherit;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">TYPING CONSOLE // MISSION 2</div>
    <div id="statsDisplay" style="font-size: 1.2rem;">Accuracy: 100%</div>
  </div>

  <div class="lesson-nav" id="lessonNav"></div>

  <div class="main-workspace">
    <div class="text-display" id="standardTextDisplay"></div>

    <div class="keyboard" id="keyboardDisplay">
      <div class="key-row">
        <div class="key" id="key-A">A</div>
        <div class="key" id="key-S">S</div>
        <div class="key" id="key-D">D</div>
        <div class="key" id="key-F">F</div>
        <div class="key" id="key-G">G</div>
        <div class="key" id="key-H">H</div>
        <div class="key" id="key-J">J</div>
        <div class="key" id="key-K">K</div>
        <div class="key" id="key-L">L</div>
        <div class="key" id="key-;">;</div>
      </div>
      <div class="key-row">
        <div class="key space" id="key- ">SPACE</div>
      </div>
    </div>
  </div>

  <div class="modal" id="completionModal">
    <div class="modal-content">
      <h2 style="color: #38bdf8; margin-bottom: 10px;">LESSON COMPLETE</h2>
      <p id="modalAccuracyText">Accuracy: 100%</p>
      <button class="modal-btn" onclick="nextLesson()">Continue Mission</button>
    </div>
  </div>

  <script>
    const lessons = [
      { id: 1, title: "Lesson 1: J & F", text: "j f j f ff jj fj jf j f jf fj", type: "standard" },
      { id: 2, title: "Lesson 2: K & D", text: "k d k d kk dd kd dk k d kd dk", type: "standard" },
      { id: 3, title: "Lesson 3: L & S", text: "l s l s ll ss ls sl l s ls sl", type: "standard" },
      { id: 4, title: "Lesson 4: ; & A", text: "; a ; a ;; aa ;a a; ; a ;a a;", type: "standard" },
      { id: 5, title: "Lesson 5: H & G", text: "h g h g hh gg hg gh h g hg gh", type: "standard" },
      { id: 6, title: "Lesson 6: Racecar Speedway", text: "Dad ads all fall Lass ask; sad jaff kad; jas salad", type: "game-racecar" }
    ];

    let currentLessonIdx = 0;
    let targetText = "";
    let currentIndex = 0;
    let keystrokes = 0;
    let errors = 0;
    let errorIndices = [];

    function init() {
      renderLessonButtons();
      loadLesson(0);
      window.addEventListener('keydown', handleInput);
    }

    function renderLessonButtons() {
      const nav = document.getElementById('lessonNav');
      nav.innerHTML = '';
      lessons.forEach((l, idx) => {
        const btn = document.createElement('button');
        btn.className = `btn-lesson ${idx === currentLessonIdx ? 'active' : ''}`;
        btn.innerText = l.title;
        btn.onclick = () => loadLesson(idx);
        nav.appendChild(btn);
      });
    }

    function loadLesson(idx) {
      currentLessonIdx = idx;
      renderLessonButtons();
      const lesson = lessons[currentLessonIdx];

      // Lesson 6 (Racecar Game) redirects to full-screen page
      if (lesson.type === "game-racecar") {
        window.location.href = "racecar-game.html";
        return;
      }

      targetText = lesson.text;
      resetLessonStateOnly();
    }

    function resetLessonStateOnly() {
      currentIndex = 0;
      keystrokes = 0;
      errors = 0;
      errorIndices = [];
      document.getElementById('statsDisplay').innerText = "Accuracy: 100%";
      renderText();
      highlightKeyboardKey();
    }

    function handleInput(e) {
      if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;
      if (currentIndex >= targetText.length) return;

      keystrokes++;
      if (e.key === targetText[currentIndex]) {
        currentIndex++;
      } else {
        errors++;
        errorIndices.push(currentIndex);
        currentIndex++;
      }

      const acc = Math.round(((keystrokes - errors) / keystrokes) * 100);
      document.getElementById('statsDisplay').innerText = `Accuracy: ${acc}%`;
      renderText();
      highlightKeyboardKey();

      if (currentIndex >= targetText.length) {
        showCompletionModal(acc);
      }
    }

    function renderText() {
      const container = document.getElementById('standardTextDisplay');
      container.innerHTML = '';
      for (let i = 0; i < targetText.length; i++) {
        const span = document.createElement('span');
        span.className = 'char-node';
        span.innerText = targetText[i] === ' ' ? '\u00A0' : targetText[i];

        if (i < currentIndex) {
          span.classList.add(errorIndices.includes(i) ? 'char-error' : 'char-done');
        } else if (i === currentIndex) {
          span.classList.add('char-current');
        }
        container.appendChild(span);
      }
    }

    function highlightKeyboardKey() {
      document.querySelectorAll('.key').forEach(k => k.classList.remove('active-target'));
      if (currentIndex < targetText.length) {
        const char = targetText[currentIndex].toUpperCase();
        const el = document.getElementById(`key-${char}`);
        if (el) el.classList.add('active-target');
      }
    }

    function showCompletionModal(acc) {
      document.getElementById('modalAccuracyText').innerText = `Final Accuracy: ${acc}%`;
      document.getElementById('completionModal').style.display = 'flex';
    }

    function nextLesson() {
      document.getElementById('completionModal').style.display = 'none';
      if (currentLessonIdx + 1 < lessons.length) {
        loadLesson(currentLessonIdx + 1);
      }
    }

    init();
  </script>
</body>
</html>
