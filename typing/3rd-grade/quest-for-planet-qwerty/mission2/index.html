<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission 2: S L A ; Keys</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&family=Fredoka+One&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --class-theme-color: #22c55e;
      --neon-green: #22c55e;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --font-tech: 'Share Tech Mono', monospace;
      --font-header: 'Orbitron', sans-serif;
      --font-playful: 'Fredoka One', cursive;

      --col-pinky: #f48ebe;
      --col-ring: #ffa336;
      --col-middle: #fdf200;
      --col-index-l: #20c98d;
      --col-index-r: #50affa;
      --col-thumb: #aa8cfd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 100%);
      color: #f8fafc; 
      font-family: 'Open Sans', sans-serif; 
      min-height: 100vh;
      padding: 15px 10px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
      overflow-x: hidden;
    }

    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .rocket-console { 
      max-width: 980px; 
      width: 100%;
      background: rgba(19, 27, 46, 0.95); 
      border-radius: 24px; 
      padding: 25px; 
      box-shadow: 0 0 35px var(--class-theme-color); 
      border: 3px solid var(--class-theme-color); 
      position: relative;
      z-index: 10;
    }

    .student-class-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--class-theme-color);
      padding: 6px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-family: var(--font-header);
      font-size: 0.85rem;
      color: var(--class-theme-color);
    }

    .btn-hub-nav {
      font-family: var(--font-tech);
      background: rgba(34, 197, 94, 0.15);
      color: #ffffff;
      border: 1px solid var(--class-theme-color);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-hub-nav:hover {
      background: var(--class-theme-color);
      color: #020617;
      box-shadow: 0 0 10px var(--class-theme-color);
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 23, 0.8);
      padding: 12px 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .title-group { display: flex; align-items: center; gap: 12px; }
    .header-rocket-icon { font-size: 2.2rem; filter: drop-shadow(0 0 8px var(--class-theme-color)); }
    .app-title { font-family: var(--font-header); color: var(--class-theme-color); font-size: 1.4rem; font-weight: 800; }

    /* Moon icon - matches the Mission 2 node icon on the Mission Hub */
    .header-moon-icon {
      width: 44px; height: 44px;
      flex-shrink: 0;
      background: #e2e8f0;
      border-radius: 50%;
      box-shadow: inset -8px -5px 0 0 #94a3b8, 0 0 10px rgba(226, 232, 240, 0.5);
      position: relative;
      overflow: hidden;
    }
    .header-moon-icon .moon-crater-1 { position: absolute; top: 7px; left: 8px; width: 8px; height: 8px; background: #cbd5e1; border-radius: 50%; }
    .header-moon-icon .moon-crater-2 { position: absolute; top: 22px; left: 20px; width: 12px; height: 12px; background: #cbd5e1; border-radius: 50%; }

    .star-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid var(--neon-amber);
      color: var(--neon-amber);
      padding: 6px 16px;
      border-radius: 20px;
      font-family: var(--font-tech);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .lesson-nav-bar {
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 18px;
      width: 100%;
    }

    .btn-lesson {
      flex: 1 1 0;
      min-width: 0;
      font-family: var(--font-tech);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 2px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .btn-lesson-title {
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
      text-align: center;
    }

    .btn-lesson-stars {
      font-size: 0.75rem;
      line-height: 1;
      color: #facc15;
      text-shadow: 0 0 4px rgba(0,0,0,0.6);
      min-height: 12px;
    }

    .btn-lesson:hover {
      border-color: var(--class-theme-color);
      color: #ffffff;
    }

    .btn-lesson.active {
      border-color: var(--class-theme-color);
      color: var(--class-theme-color);
      box-shadow: 0 0 10px var(--class-theme-color);
      background: rgba(34, 197, 94, 0.1);
    }

    .btn-lesson.completed {
      background: var(--neon-green) !important;
      color: #000000 !important;
      border-color: var(--neon-green) !important;
      font-weight: 900;
    }

    .telemetry-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
    }

    .accuracy-meter-container { display: flex; align-items: center; gap: 12px; flex: 1; }
    .meter-label { font-family: var(--font-tech); font-size: 0.85rem; color: #cbd5e1; }
    .meter-track { flex: 1; height: 14px; background: #090d16; border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
    .meter-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--neon-red), var(--neon-amber), var(--neon-green)); transition: width 0.3s; }
    .accuracy-text { font-family: var(--font-tech); font-weight: bold; font-size: 1rem; }

    .btn-control {
      font-family: var(--font-tech);
      background: #1e293b;
      color: var(--class-theme-color);
      border: 1px solid var(--class-theme-color);
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-control:hover { background: rgba(34, 197, 94, 0.2); }
    .btn-control.btn-reset-teacher {
      border-color: var(--neon-amber);
      color: var(--neon-amber);
    }
    .btn-control.btn-reset-teacher:hover {
      background: rgba(245, 158, 11, 0.2);
    }

    .terminal-display {
      background: #ffffff;
      color: #000000;
      border: 3px solid var(--class-theme-color);
      border-radius: 14px;
      padding: 20px 15px;
      margin-bottom: 15px;
      font-family: var(--font-tech);
      font-size: 1.8rem;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: break-word;
    }

    #textNodesContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      row-gap: 8px;
    }

    .char-node { 
      display: inline-block; 
      padding: 1px 2px; 
      margin: 0; 
      border-radius: 3px; 
      min-width: 0.6em; 
      text-align: center;
      color: #000000;
    }
    
    .char-node.space-node { min-width: 0.5em; }
    .char-done { color: #94a3b8; }
    .char-current { background-color: var(--class-theme-color); color: #ffffff !important; font-weight: bold; }
    .char-error { background-color: var(--neon-red) !important; color: #ffffff !important; }

    .keyboard-wrapper { width: 100%; max-width: 820px; margin: 0 auto; padding: 12px; background: #030712; border-radius: 14px; border: 1px solid #1e293b; display: none; }
    .homerow-keyboard { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .kb-row { display: flex; gap: 6px; justify-content: center; width: 100%; }
    .k { width: 54px; height: 54px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-tech); font-weight: bold; font-size: 1.2rem; color: #020617; transition: all 0.1s; }
    .k-shift { width: 90px; background: #64748b; color: white; }
    .col-a { background: var(--col-pinky); } .col-s { background: var(--col-ring); } .col-d { background: var(--col-middle); } .col-f { background: var(--col-index-l); }
    .col-j { background: var(--col-index-r); } .col-k { background: var(--col-middle); } .col-l { background: var(--col-ring); } .col-semi { background: var(--col-pinky); }
    .k-space { width: 280px; background: var(--col-thumb); }
    .k.active { transform: translateY(2px); box-shadow: 0 0 12px var(--class-theme-color); filter: brightness(1.3); }
    .k.pressed { transform: translateY(4px); filter: brightness(0.8); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3, 7, 18, 0.92); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #0f172a; border: 2px solid var(--class-theme-color); border-radius: 20px; padding: 30px; max-width: 460px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .modal-title { font-family: var(--font-header); color: var(--class-theme-color); font-size: 1.5rem; margin-bottom: 10px; }
    
    .stars-container { font-size: 2.5rem; margin: 15px 0; display: flex; justify-content: center; gap: 6px; }
    .star { color: #334155; transition: color 0.3s ease, transform 0.3s ease; }
    .star.filled { color: var(--neon-amber); text-shadow: 0 0 12px var(--neon-amber); transform: scale(1.1); }
    
    .btn-primary { font-family: var(--font-tech); background: var(--class-theme-color); color: #020617; padding: 12px 28px; border-radius: 8px; border: none; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s; margin-top: 15px; display: inline-block; }
    .btn-primary:hover { transform: scale(1.05); }

    .passcode-input {
      font-family: var(--font-tech); font-size: 1.8rem; letter-spacing: 12px; text-align: center;
      width: 180px; padding: 8px; margin: 15px auto; border-radius: 8px; border: 2px solid var(--class-theme-color);
      background: #030712; color: #ffffff; outline: none; display: block;
    }
    .modal-btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .btn-secondary { font-family: var(--font-tech); background: #334155; color: #f8fafc; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body onload="init()">

<canvas id="fireworksCanvas"></canvas>

<div class="rocket-console">
  <div class="student-class-header-bar">
    <button class="btn-hub-nav" onclick="goToHub()">⬅ RETURN TO HUB</button>
    <span id="activeClassBadge">CLASS: UNASSIGNED</span>
    <span id="activeCompBadge">COMPUTER: #--</span>
  </div>

  <div class="console-header">
    <div class="title-group">
      <div class="header-moon-icon">
        <div class="moon-crater-1"></div>
        <div class="moon-crater-2"></div>
      </div>
      <span class="app-title">Mission 2: S L A ; Keys</span>
    </div>
    <div class="star-badge">⭐ STARS: <span id="totalStarsCount">0</span></div>
  </div>

  <div class="lesson-nav-bar" id="lessonNavBar"></div>

  <div class="telemetry-bar">
    <div class="accuracy-meter-container">
      <span class="meter-label">ACCURACY:</span>
      <div class="meter-track"><div id="accuracyMeterFill" class="meter-fill"></div></div>
      <span id="accuracyVal" class="accuracy-text" style="color: var(--neon-green);">100%</span>
    </div>
    <button class="btn-control" onclick="toggleKeyboardVisibility()">KEYBOARD: <span id="kbToggleText">OFF</span></button>
    <button class="btn-control btn-reset-teacher" onclick="openTeacherResetModal()">RESET LESSON 🔒</button>
    <button class="btn-control" style="border-color: #38bdf8; color: #38bdf8;" onclick="openTeacherBypassModal()">BYPASS ⚡</button>
  </div>

  <div id="standardTextDisplay" class="terminal-display"><div id="textNodesContainer"></div></div>

  <div class="keyboard-wrapper" id="keyboardWrapper">
    <div class="homerow-keyboard">
      <div class="kb-row">
        <div class="k k-shift" id="key-shiftleft">SHIFT</div>
        <div class="k col-a" id="key-a">A</div>
        <div class="k col-s" id="key-s">S</div>
        <div class="k col-d" id="key-d">D</div>
        <div class="k col-f" id="key-f">F</div>
        <div class="k col-j" id="key-j">J</div>
        <div class="k col-k" id="key-k">K</div>
        <div class="k col-l" id="key-l">L</div>
        <div class="k col-semi" id="key-;">;</div>
        <div class="k k-shift" id="key-shiftright">SHIFT</div>
      </div>
      <div id="spacebarRow" class="kb-row">
        <div class="k k-space" id="key-space">SPACE</div>
      </div>
    </div>
  </div>

  <div id="passcodeModal" class="modal-overlay" onclick="handleBackdropClick(event)">
    <div class="modal-card">
      <h2 id="passcodeModalTitle" class="modal-title">TEACHER VERIFICATION</h2>
      <p id="passcodeModalSubtext" style="color: #cbd5e1; font-size: 0.9rem; margin-top: 5px;">Enter passcode to enable on-screen keyboard:</p>
      <input type="password" id="passcodeInput" class="passcode-input" maxlength="4" autocomplete="off">
      <div id="passcodeError" style="color: var(--neon-red); font-size: 0.85rem; height: 18px; margin-bottom: 5px;"></div>
      <div class="modal-btn-group">
        <button class="btn-secondary" onclick="closePasscodeModal()">Cancel</button>
        <button class="btn-primary" onclick="submitPasscodeAction()">Submit</button>
      </div>
    </div>
  </div>

  <div id="completionModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modalTitle" class="modal-title">LESSON ACCOMPLISHED</h2>
      <div class="stars-container" id="modalStarsContainer">
        <span class="star" id="star1">★</span>
        <span class="star" id="star2">★</span>
        <span class="star" id="star3">★</span>
        <span class="star" id="star4">★</span>
        <span class="star" id="star5">★</span>
      </div>
      <p style="margin-bottom: 15px; color: #cbd5e1; font-size: 1.1rem;" id="modalBodyText">Accuracy: <strong id="finalAccuracy">100%</strong></p>
      <button id="nextLessonBtn" class="btn-primary" onclick="handleModalAction()">Next Lesson ➔</button>
    </div>
  </div>
</div>

<script>
  const TEACHER_PASSCODE = "8760";
  const lessons = [
    { title: "1: S & L Keys", text: "sss lll ss ll ssl lls lsl sll lss sls Ss Sl Ll Ls", type: "typing" },
    { title: "2: S & L Practice", text: "ssj ssf sks sds ssl lls llf ljl ldl kll lkj sdf Lfd Skjl", type: "typing" },
    { title: "3: S & L Review", text: "slsslddkdkjfjjfsdfsdjklkjdjlkfslJdslkF", type: "typing" },
    { title: "4: A and ; Keys", text: ";;; aaa ;; aa aa; a;a ;;a a;; ;a; ;aa Aa A; ;a;aA;", type: "typing" },
    { title: "5: A and ; Practice", text: "a;a add all ka fa ja sad aa; ;;k ;;f j;; d;; l;l s;s ad; A; Ak Af", type: "typing" },
    { title: "6: Racecar Game", url: "racecar-game.html", type: "external_link" }
  ];

  let currentLessonIdx = 0;
  let targetText = "";
  let currentIndex = 0;
  let totalTyped = 0, correctTyped = 0;
  let errorIndices = [];
  let lessonStars = new Array(lessons.length).fill(0);
  let lessonAccuracy = new Array(lessons.length).fill(0);
  let showKeyboard = false;
  let teacherUnlocked = false;
  let currentPasscodeMode = 'keyboard';
  let lastAttemptPassed = false;

  let leftShiftDown = false;
  let rightShiftDown = false;

  let fireworksActive = false;
  let particles = [];

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (data && data.type === 'RACE_GAME_COMPLETE') {
      const accuracy = typeof data.accuracy === 'number' ? data.accuracy : 0;
      const stars = typeof data.stars === 'number' ? data.stars : 0;
      
      // Always replace Lesson 6 with the most recent Racecar result.
      lessonStars[5] = stars;
      lessonAccuracy[5] = accuracy;
      saveProgress();
      renderLessonButtons();

      showCompletionModal(accuracy);
    }
  });

  function launchFireworks() {
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    fireworksActive = true;
    particles = [];

    const colors = ['#22c55e', '#38bdf8', '#f59e0b', '#ec4899', '#a855f7', '#ffffff'];

    function createExplosion(x, y) {
      const particleCount = 60;
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008,
          radius: Math.random() * 3 + 2
        });
      }
    }

    let burstTimer = 0;

    function animate() {
      if (!fireworksActive) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      burstTimer++;
      if (burstTimer % 20 === 0) {
        createExplosion(
          Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
          Math.random() * canvas.height * 0.5 + canvas.height * 0.1
        );
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    animate();

    setTimeout(() => {
      fireworksActive = false;
    }, 7000);
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ShiftLeft') leftShiftDown = true;
    if (e.code === 'ShiftRight') rightShiftDown = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ShiftLeft') leftShiftDown = false;
    if (e.code === 'ShiftRight') rightShiftDown = false;
  });

  function init() {
    loadClassProfile();
    loadProgress();
    
    renderLessonButtons();
    window.addEventListener('keydown', handleKeyPress);
    window.addEventListener('keyup', handleKeyUp);
    
    document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitPasscodeAction();
    });

    const resetLesson = new URLSearchParams(window.location.search).get('resetLesson');
    if (resetLesson === '6') {
      currentLessonIdx = 5;
      lessonStars[5] = 0;
      lessonAccuracy[5] = 0;
      sessionStorage.removeItem('last_lesson_result');
      saveProgress();
      renderLessonButtons();
      // Clean the URL after processing the reset.
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Racecar can return its result through the URL. This is more reliable than
    // postMessage/sessionStorage when the game is opened as a separate page.
    const params = new URLSearchParams(window.location.search);
    const urlLessonId = Number(params.get('lessonId'));
    const urlAccuracy = Number(params.get('accuracy'));
    const urlStars = Number(params.get('stars'));
    let lastResult = null;

    if (urlLessonId === 6 && Number.isFinite(urlAccuracy) && Number.isFinite(urlStars)) {
      lastResult = JSON.stringify({ lessonId: 6, accuracy: urlAccuracy, stars: urlStars });
      window.history.replaceState({}, document.title, window.location.pathname);
    } else {
      lastResult = sessionStorage.getItem("last_lesson_result");
    }

    if (lastResult) {
      const result = JSON.parse(lastResult);
      sessionStorage.removeItem("last_lesson_result");
      currentLessonIdx = result.lessonId - 1;
      
      const starsEarned = typeof result.stars === 'number' ? result.stars : 0;
      const accuracyEarned = typeof result.accuracy === 'number' ? result.accuracy : 0;
      if (currentLessonIdx >= 0 && currentLessonIdx < lessonStars.length) {
        // Racecar Lesson 6 uses the MOST RECENT score, not the previous best.
        lessonStars[currentLessonIdx] = starsEarned;
        lessonAccuracy[currentLessonIdx] = accuracyEarned;
        saveProgress();
      }
      
      renderLessonButtons();
      showCompletionModal(result.accuracy);
    } else if (resetLesson !== '6') {
      loadLesson(0);
    }
  }

  function goToHub() {
    saveProgress();
    window.location.href = "../index.html";
  }

  function getHubKey(field) {
    const className = sessionStorage.getItem('qwerty_class_name') || 'DefaultClass';
    const compNum = sessionStorage.getItem('qwerty_computer_num') || '0';
    const safeClass = className.replace(/\s+/g, '_');
    return `qwerty_${safeClass}_comp${compNum}_mission2_${field}`;
  }

  function loadClassProfile() {
    const savedClass = sessionStorage.getItem('qwerty_class_name') || 'UNASSIGNED';
    const savedComp = sessionStorage.getItem('qwerty_computer_num') || '--';
    
    let activeColor = '#22c55e';
    const formattedClassName = savedClass.trim().toLowerCase();

    if (formattedClassName.includes('blue group')) {
      activeColor = '#38bdf8';
    } else if (formattedClassName.includes('red group')) {
      activeColor = '#ec4899';
    } else if (formattedClassName.includes('bottita')) {
      activeColor = '#f97316';
    } else if (formattedClassName.includes('raddatz')) {
      activeColor = '#eab308';
    }
    
    document.documentElement.style.setProperty('--class-theme-color', activeColor);
    document.getElementById('activeClassBadge').innerText = `CLASS: ${savedClass.toUpperCase()}`;
    document.getElementById('activeCompBadge').innerText = `COMPUTER: #${savedComp}`;
  }

  function loadProgress() {
    const savedLessonStars = localStorage.getItem(getHubKey('lesson_stars')) || localStorage.getItem('qwerty_mission2_lesson_stars');
    if (savedLessonStars) {
      try {
        const parsed = JSON.parse(savedLessonStars);
        if (Array.isArray(parsed)) {
          lessonStars = parsed;
        }
      } catch (e) {}
    }

    const savedLessonAccuracy = localStorage.getItem(getHubKey('lesson_accuracy'));
    if (savedLessonAccuracy) {
      try {
        const parsedAcc = JSON.parse(savedLessonAccuracy);
        if (Array.isArray(parsedAcc)) {
          lessonAccuracy = parsedAcc;
        }
      } catch (e) {}
    }

    const totalStars = lessonStars.reduce((a, b) => a + b, 0);
    document.getElementById('totalStarsCount').innerText = totalStars;
  }

  function saveProgress() {
    const totalAccumulated = lessonStars.reduce((a, b) => a + b, 0);

    localStorage.setItem(getHubKey('lesson_stars'), JSON.stringify(lessonStars));
    localStorage.setItem(getHubKey('lesson_accuracy'), JSON.stringify(lessonAccuracy));
    localStorage.setItem(getHubKey('stars'), totalAccumulated);

    localStorage.setItem('qwerty_mission2_stars', totalAccumulated);
    localStorage.setItem('qwerty_mission2_lesson_stars', JSON.stringify(lessonStars));
    sessionStorage.setItem('qwerty_mission2_stars', totalAccumulated);

    document.getElementById('totalStarsCount').innerText = totalAccumulated;

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'UPDATE_MISSION_STARS',
        missionId: 2,
        stars: totalAccumulated,
        lessonStars: lessonStars
      }, '*');
    }
  }

  function renderLessonButtons() {
    const navBar = document.getElementById('lessonNavBar');
    navBar.innerHTML = '';
    lessons.forEach((l, idx) => {
      const btn = document.createElement('button');
      const isCompleted = lessonStars[idx] > 0;
      btn.className = `btn-lesson ${idx === currentLessonIdx ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
      
      const starsDisplay = isCompleted ? '★'.repeat(lessonStars[idx]) : '';

      btn.innerHTML = `
        <span class="btn-lesson-title">${isCompleted ? '✔ ' : ''}${l.title}</span>
        <span class="btn-lesson-stars">${starsDisplay}</span>
      `;
      btn.onclick = () => loadLesson(idx);
      navBar.appendChild(btn);
    });
  }

  function loadLesson(idx) {
    currentLessonIdx = idx;
    renderLessonButtons();
    const lesson = lessons[currentLessonIdx];

    if (lesson.type === "external_link") {
      const cls = sessionStorage.getItem('qwerty_class_name') || '';
      const comp = sessionStorage.getItem('qwerty_computer_num') || '';
      window.location.href = `${lesson.url}?class=${encodeURIComponent(cls)}&comp=${encodeURIComponent(comp)}`;
      return;
    }

    document.getElementById('standardTextDisplay').style.display = 'flex';
    updateKeyboardDisplayState();

    targetText = lesson.text;
    resetLessonStateOnly();
  }

  function resetLessonStateOnly() {
    currentIndex = 0; totalTyped = 0; correctTyped = 0; errorIndices = [];
    updateAccuracyMeter(100);
    document.getElementById('completionModal').classList.remove('active');
    // Lesson 6 is an external game, so there is no typing display to reset here.
    if (lessons[currentLessonIdx].type !== 'external_link') {
      updateTargetAndKeyboard();
    }
  }

  function updateAccuracyMeter(acc) {
    document.getElementById('accuracyMeterFill').style.width = `${acc}%`;
    const txt = document.getElementById('accuracyVal');
    txt.innerText = `${acc}%`;
    txt.style.color = acc >= 90 ? 'var(--neon-green)' : (acc >= 80 ? 'var(--neon-amber)' : 'var(--neon-red)');
  }

  function updateTargetAndKeyboard() {
    document.querySelectorAll('.k').forEach(k => k.classList.remove('active'));
    if (currentIndex >= targetText.length) return;

    const currentChar = targetText[currentIndex];
    const container = document.getElementById('textNodesContainer');
    container.innerHTML = '';
    
    for (let i = 0; i < targetText.length; i++) {
      const span = document.createElement('span');
      span.className = 'char-node';
      if (targetText[i] === ' ') {
        span.classList.add('space-node');
        span.innerHTML = '&nbsp;';
      } else {
        span.innerText = targetText[i];
      }
      
      if (i < currentIndex) span.classList.add(errorIndices.includes(i) ? 'char-error' : 'char-done');
      else if (i === currentIndex) span.classList.add('char-current');
      container.appendChild(span);
    }

    const isKbVisible = showKeyboard;
    if (isKbVisible) {
      let keyId = currentChar === ' ' ? 'key-space' : `key-${currentChar.toLowerCase()}`;
      const activeKey = document.getElementById(keyId);
      if (activeKey) activeKey.classList.add('active');

      if (currentChar === currentChar.toUpperCase() && currentChar !== ' ' && currentChar !== ';') {
        const isRightHand = ['j', 'k', 'l', ';'].includes(currentChar.toLowerCase());
        const shiftKey = isRightHand ? document.getElementById('key-shiftleft') : document.getElementById('key-shiftright');
        if (shiftKey) shiftKey.classList.add('active');
      }
    }
  }

  function handleKeyPress(e) {
    if (document.getElementById('passcodeModal').classList.contains('active')) return;
    if (e.key === 'Shift') return;
    if (e.key === ' ') e.preventDefault();
    
    let keyId = e.key === ' ' ? 'key-space' : `key-${e.key.toLowerCase()}`;
    let pressedKeyEl = document.getElementById(keyId);
    if (pressedKeyEl) pressedKeyEl.classList.add('pressed');

    if (e.key === 'Enter' && document.getElementById('completionModal').classList.contains('active')) {
      handleModalAction(); return;
    }

    if (e.key.length !== 1 || e.ctrlKey || e.altKey || e.metaKey) return;

    const expectedChar = targetText[currentIndex];
    const isUppercaseExpected = (expectedChar === expectedChar.toUpperCase() && expectedChar !== ' ' && expectedChar !== ';');

    let isValid = false;

    if (isUppercaseExpected) {
      const isRightHandLetter = ['j', 'k', 'l', ';', 'u', 'i', 'o', 'p', 'h', 'n', 'm'].includes(expectedChar.toLowerCase());
      const usedCorrectShift = isRightHandLetter ? leftShiftDown : rightShiftDown;
      isValid = (e.key === expectedChar && usedCorrectShift);
    } else {
      isValid = (e.key === expectedChar);
    }

    totalTyped++;
    if (isValid) {
      correctTyped++;
    } else {
      errorIndices.push(currentIndex);
    }
    
    currentIndex++;

    const acc = Math.round((correctTyped / totalTyped) * 100);
    updateAccuracyMeter(acc);
    updateTargetAndKeyboard();
    if (currentIndex >= targetText.length) showCompletionModal(acc);
  }

  function handleKeyUp(e) {
    let keyId = e.key === ' ' ? 'key-space' : `key-${e.key.toLowerCase()}`;
    let pressedKeyEl = document.getElementById(keyId);
    if (pressedKeyEl) pressedKeyEl.classList.remove('pressed');
  }

  function toggleKeyboardVisibility() {
    if (showKeyboard) {
      showKeyboard = false;
      teacherUnlocked = false;
      updateKeyboardDisplayState();
    } else {
      if (teacherUnlocked) {
        showKeyboard = true;
        updateKeyboardDisplayState();
      } else {
        openPasscodeModal('keyboard');
      }
    }
  }

  function openTeacherResetModal() {
    openPasscodeModal('reset');
  }

  function openTeacherBypassModal() {
    openPasscodeModal('bypass');
  }

  function openPasscodeModal(mode) {
    currentPasscodeMode = mode;
    document.getElementById('passcodeInput').value = '';
    document.getElementById('passcodeError').innerText = '';
    
    const titleEl = document.getElementById('passcodeModalTitle');
    const subtextEl = document.getElementById('passcodeModalSubtext');

    if (mode === 'reset') {
      titleEl.innerText = "TEACHER RESET";
      subtextEl.innerText = `Enter passcode to reset ${lessons[currentLessonIdx].title}:`;
    } else if (mode === 'bypass') {
      titleEl.innerText = "TESTING BYPASS";
      subtextEl.innerText = `Enter passcode to bypass ${lessons[currentLessonIdx].title}:`;
    } else {
      titleEl.innerText = "TEACHER VERIFICATION";
      subtextEl.innerText = "Enter passcode to enable on-screen keyboard:";
    }

    document.getElementById('passcodeModal').classList.add('active');
    setTimeout(() => document.getElementById('passcodeInput').focus(), 100);
  }

  function closePasscodeModal() {
    document.getElementById('passcodeModal').classList.remove('active');
  }

  function handleBackdropClick(e) {
    if (e.target.id === 'passcodeModal') closePasscodeModal();
  }

  function submitPasscodeAction() {
    if (document.getElementById('passcodeInput').value === TEACHER_PASSCODE) {
      closePasscodeModal();
      if (currentPasscodeMode === 'keyboard') {
        teacherUnlocked = true;
        showKeyboard = true;
        updateKeyboardDisplayState();
      } else if (currentPasscodeMode === 'reset') {
        lessonStars[currentLessonIdx] = 0;
        lessonAccuracy[currentLessonIdx] = 0;
        saveProgress();
        renderLessonButtons();
        resetLessonStateOnly();
      } else if (currentPasscodeMode === 'bypass') {
        showCompletionModal(100);
      }
    } else {
      document.getElementById('passcodeError').innerText = 'Incorrect Passcode';
    }
  }

  function updateKeyboardDisplayState() {
    const shouldDisplay = showKeyboard;
    document.getElementById('kbToggleText').innerText = showKeyboard ? 'ON' : 'OFF';
    document.getElementById('keyboardWrapper').style.display = shouldDisplay ? 'block' : 'none';
  }

  function estimateAccuracyFromStars(stars) {
    // Used only as a fallback for progress saved before per-lesson accuracy
    // tracking existed (stars recorded, but no real accuracy on file).
    if (stars >= 5) return 97;
    if (stars === 4) return 92;
    if (stars === 3) return 87;
    if (stars === 2) return 84;
    if (stars === 1) return 81;
    return 0;
  }

  function showCompletionModal(accuracy) {
    let starsEarned = 0;
    if (accuracy >= 80 && accuracy <= 82) starsEarned = 1;
    else if (accuracy >= 83 && accuracy <= 85) starsEarned = 2;
    else if (accuracy >= 86 && accuracy <= 89) starsEarned = 3;
    else if (accuracy >= 90 && accuracy <= 94) starsEarned = 4;
    else if (accuracy >= 95) starsEarned = 5;

    lastAttemptPassed = (accuracy >= 80);

    if (lastAttemptPassed && lessons[currentLessonIdx].type !== "external_link") {
      if (starsEarned >= lessonStars[currentLessonIdx]) {
        lessonAccuracy[currentLessonIdx] = accuracy;
      }
      lessonStars[currentLessonIdx] = Math.max(lessonStars[currentLessonIdx], starsEarned);
      saveProgress();
      renderLessonButtons();
    }

    const starsContainer = document.getElementById('modalStarsContainer');
    const titleEl = document.getElementById('modalTitle');
    const bodyTextEl = document.getElementById('modalBodyText');
    const nextBtn = document.getElementById('nextLessonBtn');
    
    const isLastLesson = (currentLessonIdx === lessons.length - 1);
    const totalAccumulatedStars = lessonStars.reduce((a, b) => a + b, 0);
    let accuracySum = 0;
    let completedLessonCount = 0;
    for (let i = 0; i < lessons.length; i++) {
      if (lessonStars[i] > 0) {
        completedLessonCount++;
        accuracySum += (lessonAccuracy[i] > 0) ? lessonAccuracy[i] : estimateAccuracyFromStars(lessonStars[i]);
      }
    }
    const overallAccuracy = completedLessonCount > 0 ? Math.round(accuracySum / completedLessonCount) : 0;

    const starGuideHtml = `
      <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
        <strong>Star Rating System:</strong><br>
        5★: 95%+ | 4★: 90-94% | 3★: 86-89% | 2★: 83-85% | 1★: 80-82%
      </div>
    `;

    if (!lastAttemptPassed) {
      starsContainer.style.display = 'none';
      titleEl.innerText = "TRY AGAIN!";
      titleEl.style.color = "var(--neon-red)";
      bodyTextEl.innerHTML = `Accuracy: <strong style="color: var(--neon-red);">${accuracy}%</strong><br><br>You need at least <strong>80%</strong> accuracy to earn stars and pass this lesson. Give it another try!${starGuideHtml}`;
      nextBtn.innerText = "Try Lesson Again 🔄";
    } else if (isLastLesson) {
      // Mission-complete popup: no star rating here, just the overall mission summary.
      starsContainer.style.display = 'none';
      titleEl.style.color = "var(--class-theme-color)";
      titleEl.innerText = "🎉 MISSION 2 COMPLETE! 🎉";
      bodyTextEl.innerHTML = `Total Mission Accuracy: <strong>${overallAccuracy}%</strong><br>Total Mission Stars Earned: <strong style="color:var(--neon-amber);">${totalAccumulatedStars} / 30</strong>`;
      nextBtn.innerText = "Return to mission hub";
      launchFireworks();
    } else {
      starsContainer.style.display = 'flex';
      titleEl.style.color = "var(--class-theme-color)";
      
      for (let i = 1; i <= 5; i++) {
        const starEl = document.getElementById(`star${i}`);
        if (starEl) {
          starEl.className = `star ${starsEarned >= i ? 'filled' : ''}`;
        }
      }

      titleEl.innerText = "LESSON ACCOMPLISHED";
      bodyTextEl.innerHTML = `Accuracy: <strong>${accuracy}%</strong>`;
      nextBtn.innerText = "Next Lesson ➔";
    }

    document.getElementById('completionModal').classList.add('active');
  }

  function handleModalAction() {
    document.getElementById('completionModal').classList.remove('active');
    
    if (!lastAttemptPassed) {
      resetLessonStateOnly();
      return;
    }

    if (currentLessonIdx < lessons.length - 1) {
      loadLesson(currentLessonIdx + 1);
    } else {
      goToHub();
    }
  }
</script>
</body>
