<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QWERTY Rockets - Mission Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Share+Tech+Mono&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --class-theme-color: #22c55e;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --font-tech: 'Share Tech Mono', monospace;
      --font-header: 'Orbitron', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 100%);
      color: #f8fafc; 
      font-family: 'Open Sans', sans-serif; 
      min-height: 100vh;
      padding: 20px 10px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      user-select: none;
    }

    .hub-console { 
      max-width: 1000px; 
      width: 100%;
      background: rgba(19, 27, 46, 0.95); 
      border-radius: 24px; 
      padding: 25px; 
      box-shadow: 0 0 35px var(--class-theme-color); 
      border: 3px solid var(--class-theme-color); 
      position: relative;
    }

    .student-class-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid var(--class-theme-color);
      padding: 8px 16px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-family: var(--font-header);
      font-size: 0.9rem;
      color: var(--class-theme-color);
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 23, 0.8);
      padding: 15px 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .app-title { font-family: var(--font-header); color: var(--class-theme-color); font-size: 1.6rem; font-weight: 800; }

    .total-stars-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid var(--neon-amber);
      color: var(--neon-amber);
      padding: 6px 16px;
      border-radius: 20px;
      font-family: var(--font-tech);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .missions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 15px;
    }

    .mission-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .mission-card.unlocked {
      border-color: var(--class-theme-color);
    }

    .mission-card.completed {
      border-color: var(--class-theme-color);
      background: rgba(34, 197, 94, 0.08);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
    }

    .mission-card.locked {
      opacity: 0.5;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .mission-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .mission-icon { font-size: 2.2rem; }

    .mission-title-group { display: flex; flex-direction: column; }
    .mission-number { font-family: var(--font-tech); font-size: 0.8rem; color: #94a3b8; }
    
    .mission-title { 
      font-family: var(--font-header); 
      font-size: 1.1rem; 
      font-weight: bold; 
      color: #ffffff; 
    }

    .mission-card.completed .mission-title {
      color: var(--class-theme-color);
    }

    .mission-stars-info {
      font-family: var(--font-tech);
      font-size: 0.95rem;
      color: var(--neon-amber);
      margin-bottom: 15px;
    }

    .btn-launch {
      font-family: var(--font-tech);
      background: var(--class-theme-color);
      color: #020617;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-launch:hover { transform: scale(1.03); }

    .btn-launch.disabled {
      background: #334155;
      color: #64748b;
      pointer-events: none;
    }
  </style>
</head>
<body onload="initHub()">

<div class="hub-console">
  <div class="student-class-header-bar">
    <span id="activeClassBadge">CLASS: UNASSIGNED</span>
    <span id="activeCompBadge">COMPUTER: #--</span>
  </div>

  <div class="console-header">
    <span class="app-title">🚀 MISSION HUB</span>
    <div class="total-stars-badge">TOTAL STARS: <span id="hubTotalStars">0</span></div>
  </div>

  <div class="missions-grid" id="missionsGrid"></div>
</div>

<script>
  const MISSION_CONFIG = [
    { id: 1, title: "Mission 1: F D J K Keys", icon: "🚀", url: "mission1/index.html", totalLessons: 6 },
    { id: 2, title: "Mission 2: S L A ; Keys", icon: "🎯", url: "mission2/index.html", totalLessons: 6 }
  ];

  function getHubKey(missionId, field) {
    const className = sessionStorage.getItem('qwerty_class_name') || 'DefaultClass';
    const compNum = sessionStorage.getItem('qwerty_computer_num') || '0';
    const safeClass = className.replace(/\s+/g, '_');
    return `qwerty_${safeClass}_comp${compNum}_mission${missionId}_${field}`;
  }

  function loadClassProfile() {
    const savedClass = sessionStorage.getItem('qwerty_class_name') || 'UNASSIGNED';
    const savedComp = sessionStorage.getItem('qwerty_computer_num') || '--';
    
    let activeColor = '#22c55e';
    const formattedClassName = savedClass.trim().toLowerCase();

    if (formattedClassName.includes('blue group')) {
      activeColor = '#38bdf8';
    } else if (formattedClassName.includes('red group')) {
      activeColor = '#ec4899';
    } else if (formattedClassName.includes('bottita')) {
      activeColor = '#f97316';
    } else if (formattedClassName.includes('raddatz')) {
      activeColor = '#eab308';
    }
    
    document.documentElement.style.setProperty('--class-theme-color', activeColor);
    document.getElementById('activeClassBadge').innerText = `CLASS: ${savedClass.toUpperCase()}`;
    document.getElementById('activeCompBadge').innerText = `COMPUTER: #${savedComp}`;
  }

  function isMissionFullyCompleted(missionId, totalLessons) {
    const rawStarsArray = localStorage.getItem(getHubKey(missionId, 'lesson_stars'));
    if (!rawStarsArray) return false;

    try {
      const parsedStars = JSON.parse(rawStarsArray);
      if (!Array.isArray(parsedStars) || parsedStars.length < totalLessons) return false;
      return parsedStars.every(stars => typeof stars === 'number' && stars > 0);
    } catch (e) {
      return false;
    }
  }

  function getMissionStarCount(missionId) {
    const rawStarsArray = localStorage.getItem(getHubKey(missionId, 'lesson_stars'));
    if (!rawStarsArray) return 0;
    try {
      const parsedStars = JSON.parse(rawStarsArray);
      if (Array.isArray(parsedStars)) {
        return parsedStars.reduce((acc, curr) => acc + (curr || 0), 0);
      }
    } catch (e) {}
    return 0;
  }

  function initHub() {
    loadClassProfile();

    const grid = document.getElementById('missionsGrid');
    grid.innerHTML = '';

    let grandTotalStars = 0;
    let previousMissionCompleted = true;

    MISSION_CONFIG.forEach((m, idx) => {
      const isCompleted = isMissionFullyCompleted(m.id, m.totalLessons);
      const starsEarned = getMissionStarCount(m.id);
      grandTotalStars += starsEarned;

      const isUnlocked = idx === 0 || previousMissionCompleted;

      const card = document.createElement('div');
      card.className = `mission-card ${isUnlocked ? 'unlocked' : 'locked'} ${isCompleted ? 'completed' : ''}`;

      card.innerHTML = `
        <div>
          <div class="mission-card-header">
            <span class="mission-icon">${m.icon}</span>
            <div class="mission-title-group">
              <span class="mission-number">MISSION ${m.id}</span>
              <span class="mission-title">${m.title}</span>
            </div>
          </div>
          <div class="mission-stars-info">
            ⭐ ${starsEarned} / ${m.totalLessons * 5} Stars
          </div>
        </div>
        ${isUnlocked 
          ? `<a href="${m.url}" class="btn-launch">LAUNCH MISSION ➔</a>`
          : `<button class="btn-launch disabled" disabled>🔒 LOCKED</button>`
        }
      `;

      grid.appendChild(card);
      previousMissionCompleted = isCompleted;
    });

    document.getElementById('hubTotalStars').innerText = grandTotalStars;
  }
</script>
</body>
</html>
