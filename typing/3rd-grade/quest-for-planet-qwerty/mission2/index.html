<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission 2 - SLA;</title>
  <style>
    body {
      background: #090d16;
      color: #ffffff;
      font-family: 'Open Sans', sans-serif;
      padding: 20px;
      text-align: center;
    }
    .header-card {
      background: #0f172a;
      border: 2px solid #22c55e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .star-counter { font-size: 1.5rem; color: #ffd700; font-weight: bold; }
    .game-container { margin-top: 20px; }
    iframe {
      width: 100%;
      max-width: 900px;
      height: 550px;
      border: 2px solid #334155;
      border-radius: 12px;
    }
    .btn-hub {
      margin-top: 15px;
      background: #1e293b;
      color: #22c55e;
      border: 1px solid #22c55e;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <h1>Mission 2: SLA; Sequence</h1>
    <div class="star-counter">Total Stars: <span id="totalStars">0</span> / 30 ★</div>
    <a href="../index.html" class="btn-hub">← Back to Mission Hub</a>
  </div>

  <div class="game-container">
    <h3>Lesson 6: Racecar Challenge</h3>
    <iframe src="racecar-game.html" id="raceFrame"></iframe>
  </div>

  <script>
    let lessonStars = [0, 0, 0, 0, 0, 0];

    function getHubKey(field) {
      const className = sessionStorage.getItem('qwerty_class_name') || 'DefaultClass';
      const compNum = sessionStorage.getItem('qwerty_computer_num') || '0';
      const safeClass = className.replace(/\s+/g, '_');
      return `qwerty_${safeClass}_comp${compNum}_mission2_${field}`;
    }

    function loadProgress() {
      const savedData = localStorage.getItem(getHubKey('lesson_stars')) || localStorage.getItem('qwerty_mission2_lesson_stars');
      if (savedData) {
        try {
          lessonStars = JSON.parse(savedData);
        } catch (e) {
          console.error("Error loading progress", e);
        }
      }
      updateUI();
    }

    function saveProgress() {
      const totalAccumulated = lessonStars.reduce((a, b) => a + b, 0);

      // Save both class-scoped and fallback global keys
      localStorage.setItem(getHubKey('lesson_stars'), JSON.stringify(lessonStars));
      localStorage.setItem(getHubKey('stars'), totalAccumulated);
      localStorage.setItem('qwerty_mission2_lesson_stars', JSON.stringify(lessonStars));
      localStorage.setItem('qwerty_mission2_stars', totalAccumulated);

      updateUI();

      // Send update message to parent hub frame if running in iframe
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'UPDATE_MISSION_STARS',
          missionId: 2,
          stars: totalAccumulated,
          lessonStars: lessonStars
        }, '*');
      }
    }

    function updateUI() {
      const totalAccumulated = lessonStars.reduce((a, b) => a + b, 0);
      document.getElementById('totalStars').innerText = totalAccumulated;
    }

    // Listen for race completion messages from racecar-game iframe
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data && data.type === 'RACE_GAME_COMPLETE') {
        const earnedStars = data.stars || 0;
        // Update Lesson 6 stars (index 5)
        lessonStars[5] = Math.max(lessonStars[5], earnedStars);
        saveProgress();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      
      // Fallback check if racecar wrote directly to sessionStorage
      const lastResult = sessionStorage.getItem('last_lesson_result');
      if (lastResult) {
        try {
          const parsed = JSON.parse(lastResult);
          if (parsed.lessonId === 6) {
            lessonStars[5] = Math.max(lessonStars[5], parsed.stars);
            sessionStorage.removeItem('last_lesson_result');
            saveProgress();
          }
        } catch(e) {
          console.error("Failed to parse last_lesson_result", e);
        }
      }
    });
  </script>
</body>
</html>
